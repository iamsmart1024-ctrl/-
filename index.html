const PEN_COLORS = ['#1C1917', '#C0392B', '#2563EB', '#27AE60', '#F59E0B', '#7C3AED'];

function setupSolver() {
  const stage = $('#solver-stage');
  const area = $('#solver-area');
  const world = $('#solver-world');
  const memo = $('#solver-memo');
  const ctx = memo.getContext('2d');

  Object.assign(QUIZ_STATE, {
    stage, area, world, memo, ctx,
    tool: 'pen',
    penSize: 3,
    penColor: '#1C1917',
    eraserSize: 36,
    zoom: 1,
    panX: 0, panY: 0,
    contentW: 0, contentH: 0,
    worldW: 0, worldH: 0,
    memos: {},
    pdfDoc: null, pdfPages: []
  });

  // 펜 색상 팔레트 만들기
  const palette = $('#pen-colors');
  if (palette) {
    palette.innerHTML = PEN_COLORS.map((c, i) => `<div class="color-swatch ${i===0?'active':''}" data-color="${c}" style="background:${c}"></div>`).join('');
    palette.querySelectorAll('.color-swatch').forEach(s => s.onclick = () => {
      QUIZ_STATE.penColor = s.dataset.color;
      palette.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
    });
  }

  // 슬라이더
  const penSize = $('#pen-size');
  const penSizeVal = $('#pen-size-val');
  if (penSize) penSize.oninput = () => { QUIZ_STATE.penSize = parseInt(penSize.value); penSizeVal.textContent = penSize.value; };
  const eraserSize = $('#eraser-size');
  const eraserSizeVal = $('#eraser-size-val');
  if (eraserSize) eraserSize.oninput = () => { QUIZ_STATE.eraserSize = parseInt(eraserSize.value); eraserSizeVal.textContent = eraserSize.value; };

  // 도구 버튼
  $('#tool-pen').onclick = () => setTool('pen');
  $('#tool-eraser').onclick = () => setTool('eraser');
  $('#tool-pan').onclick = () => setTool('pan');
  $('#tool-zin').onclick = () => zoomBy(1.25);
  $('#tool-zout').onclick = () => zoomBy(0.8);
  $('#tool-zfit').onclick = () => fitToScreen();
  $('#tool-clear').onclick = async () => {
    if (!await confirmDialog('필기를 모두 지울까요?', '현재 페이지의 필기만 지웁니다.', '지우기', true)) return;
    clearMemo();
  };

  // PDF 네비게이션
  if ($('#pdf-prev')) {
    $('#pdf-prev').onclick = () => goPdfPage(QUIZ_STATE.pdfCurrentPage - 1);
    $('#pdf-next').onclick = () => goPdfPage(QUIZ_STATE.pdfCurrentPage + 1);
  }

  // === 그리기 + 패닝 + 핀치줌 ===
  const pointers = new Map();
  let drawing = false, panning = false, lastDraw = null, pinchStart = null, panStart = null;

  // world(이미지+캔버스) 좌표로 변환 (zoom/pan 보정)
  const screenToWorld = (clientX, clientY) => {
    const rect = stage.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    return {
      x: (sx - QUIZ_STATE.panX) / QUIZ_STATE.zoom,
      y: (sy - QUIZ_STATE.panY) / QUIZ_STATE.zoom
    };
  };

  const showZoomInfo = () => {
    const info = $('#zoom-info');
    if (!info) return;
    info.textContent = `${Math.round(QUIZ_STATE.zoom * 100)}%`;
    info.classList.add('show');
    clearTimeout(QUIZ_STATE._zoomInfoTimer);
    QUIZ_STATE._zoomInfoTimer = setTimeout(() => info.classList.remove('show'), 1000);
  };

  const updateTransform = () => {
    world.style.transform = `translate(${QUIZ_STATE.panX}px, ${QUIZ_STATE.panY}px) scale(${QUIZ_STATE.zoom})`;
    showZoomInfo();
  };
  QUIZ_STATE._updateTransform = updateTransform;

  const drawPoint = (p, isStart) => {
    const c = ctx;
    const isErase = QUIZ_STATE.tool === 'eraser';
    c.globalCompositeOperation = isErase ? 'destination-out' : 'source-over';
    c.lineCap = 'round';
    c.lineJoin = 'round';
    c.strokeStyle = QUIZ_STATE.penColor;
    c.fillStyle = QUIZ_STATE.penColor;
    c.lineWidth = isErase ? QUIZ_STATE.eraserSize : QUIZ_STATE.penSize;
    if (isStart) {
      // 점 찍기
      c.beginPath();
      c.arc(p.x, p.y, isErase ? QUIZ_STATE.eraserSize/2 : QUIZ_STATE.penSize/2, 0, Math.PI * 2);
      c.fill();
    } else if (lastDraw) {
      c.beginPath();
      c.moveTo(lastDraw.x, lastDraw.y);
      c.lineTo(p.x, p.y);
      c.stroke();
    }
    lastDraw = p;
  };

  const onPointerDown = (e) => {
    e.preventDefault();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { area.setPointerCapture(e.pointerId); } catch(_) {}

    if (pointers.size === 2) {
      // 핀치줌 시작
      drawing = false;
      panning = false;
      lastDraw = null;
      const pts = [...pointers.values()];
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      pinchStart = {
        dist: Math.hypot(dx, dy),
        cx: (pts[0].x + pts[1].x) / 2,
        cy: (pts[0].y + pts[1].y) / 2,
        zoom: QUIZ_STATE.zoom,
        panX: QUIZ_STATE.panX,
        panY: QUIZ_STATE.panY
      };
      return;
    }

    if (pointers.size === 1) {
      // 손바닥 도구이거나 펜이 아닌 경우 패닝
      if (QUIZ_STATE.tool === 'pan') {
        panning = true;
        panStart = { x: e.clientX, y: e.clientY, panX: QUIZ_STATE.panX, panY: QUIZ_STATE.panY };
        area.style.cursor = 'grabbing';
      } else {
        // 펜/지우개 → 그리기 시작
        drawing = true;
        const p = screenToWorld(e.clientX, e.clientY);
        lastDraw = null;
        drawPoint(p, true);
      }
    }
  };

  const onPointerMove = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2 && pinchStart) {
      e.preventDefault();
      const pts = [...pointers.values()];
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      const dist = Math.hypot(dx, dy);
      const ratio = dist / pinchStart.dist;
      const newZoom = Math.max(0.2, Math.min(8, pinchStart.zoom * ratio));

      const stageRect = stage.getBoundingClientRect();
      const focalX = pinchStart.cx - stageRect.left;
      const focalY = pinchStart.cy - stageRect.top;
      const scale = newZoom / pinchStart.zoom;

      QUIZ_STATE.zoom = newZoom;
      QUIZ_STATE.panX = pinchStart.panX + (1 - scale) * (focalX - pinchStart.panX);
      QUIZ_STATE.panY = pinchStart.panY + (1 - scale) * (focalY - pinchStart.panY);

      // 두 손가락 중심점 이동도 추가 (panning)
      const newCx = (pts[0].x + pts[1].x) / 2;
      const newCy = (pts[0].y + pts[1].y) / 2;
      QUIZ_STATE.panX += (newCx - pinchStart.cx);
      QUIZ_STATE.panY += (newCy - pinchStart.cy);

      updateTransform();
    } else if (drawing && pointers.size === 1) {
      e.preventDefault();
      const p = screenToWorld(e.clientX, e.clientY);
      drawPoint(p, false);
    } else if (panning && pointers.size === 1) {
      e.preventDefault();
      QUIZ_STATE.panX = panStart.panX + (e.clientX - panStart.x);
      QUIZ_STATE.panY = panStart.panY + (e.clientY - panStart.y);
      updateTransform();
    }
  };

  const onPointerUp = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
    if (pointers.size === 0) {
      if (drawing) saveCurrentMemo();
      drawing = false;
      panning = false;
      lastDraw = null;
      panStart = null;
      area.style.cursor = QUIZ_STATE.tool === 'pan' ? 'grab' : (QUIZ_STATE.tool === 'pen' || QUIZ_STATE.tool === 'eraser' ? 'crosshair' : 'grab');
    }
  };

  area.addEventListener('pointerdown', onPointerDown);
  area.addEventListener('pointermove', onPointerMove);
  area.addEventListener('pointerup', onPointerUp);
  area.addEventListener('pointercancel', onPointerUp);
  area.addEventListener('pointerleave', onPointerUp);

  // 마우스 휠 줌
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const stageRect = stage.getBoundingClientRect();
    const focalX = e.clientX - stageRect.left;
    const focalY = e.clientY - stageRect.top;
    const oldZoom = QUIZ_STATE.zoom;
    const newZoom = Math.max(0.2, Math.min(8, oldZoom * factor));
    const scale = newZoom / oldZoom;
    QUIZ_STATE.zoom = newZoom;
    QUIZ_STATE.panX = QUIZ_STATE.panX + (1 - scale) * (focalX - QUIZ_STATE.panX);
    QUIZ_STATE.panY = QUIZ_STATE.panY + (1 - scale) * (focalY - QUIZ_STATE.panY);
    updateTransform();
  }, { passive: false });

  window.addEventListener('resize', () => fitToScreen());

  setTool('pen');
}

function setTool(tool) {
  if (!QUIZ_STATE) return;
  QUIZ_STATE.tool = tool;
  $('#tool-pen').classList.toggle('active', tool === 'pen');
  $('#tool-eraser').classList.toggle('active', tool === 'eraser');
  $('#tool-pan').classList.toggle('active', tool === 'pan');
  $('#pen-section').classList.toggle('show', tool === 'pen');
  $('#eraser-section').classList.toggle('show', tool === 'eraser');
  const area = $('#solver-area');
  if (area) {
    if (tool === 'pan') area.style.cursor = 'grab';
    else if (tool === 'pen' || tool === 'eraser') area.style.cursor = 'crosshair';
  }
}

function clearMemo() {
  const ctx = QUIZ_STATE.ctx;
  if (!ctx) return;
  ctx.clearRect(0, 0, QUIZ_STATE.memo.width, QUIZ_STATE.memo.height);
  if (QUIZ_STATE.memos) QUIZ_STATE.memos[memoKey()] = null;
}

function memoKey() {
  if (QUIZ_STATE.contentType === 'pdf') return `pdf-${QUIZ_STATE.pdfCurrentPage}`;
  return `q-${QUIZ_STATE.currentIdx}`;
}

function saveCurrentMemo() {
  if (!QUIZ_STATE.memo) return;
  if (!QUIZ_STATE.memos) QUIZ_STATE.memos = {};
  try {
    QUIZ_STATE.memos[memoKey()] = QUIZ_STATE.memo.toDataURL('image/png');
  } catch (e) { /* ignore */ }
}

function showQuestion(idx) {
  if (idx < 0 || idx >= QUIZ_STATE.questions.length) return;
  QUIZ_STATE.currentIdx = idx;
  const q = QUIZ_STATE.questions[idx];
  const url = QUIZ_STATE.images[idx].url;

  const content = $('#solver-content');
  content.innerHTML = `<img id="solver-img" alt="문제" style="display:block;">`;
  const img = $('#solver-img');
  img.onload = () => {
    QUIZ_STATE.contentW = img.naturalWidth;
    QUIZ_STATE.contentH = img.naturalHeight;
    setupWorld();
    fitToScreen();
    restoreMemoForCurrent();
  };
  img.src = url;

  $('#qt-counter').textContent = `${idx+1} / ${QUIZ_STATE.questions.length}`;
  const labelEl = $('#answer-label');
  if (labelEl) labelEl.textContent = `${QUIZ_STATE.questionLabels[idx]} 정답`;
  $('#qt-answer').value = QUIZ_STATE.responses[q.id] || '';

  if ($('#qt-prev')) $('#qt-prev').style.visibility = idx === 0 ? 'hidden' : 'visible';
  if ($('#qt-next')) $('#qt-next').style.visibility = idx === QUIZ_STATE.questions.length - 1 ? 'hidden' : 'visible';

  updateProgressDots();
  updateSubmitButton();
}

// world와 memo canvas의 크기 설정
// content 주변에 큰 여백을 둬서 무한 캔버스처럼 동작
function setupWorld() {
  const content = $('#solver-content');
  const world = $('#solver-world');
  const memo = $('#solver-memo');

  const cw = QUIZ_STATE.contentW;
  const ch = QUIZ_STATE.contentH;

  // 컨텐츠 사이즈 설정
  content.style.width = cw + 'px';
  content.style.height = ch + 'px';

  // world 크기 = content 크기 (정렬은 transform에서)
  // 하지만 캔버스는 content보다 더 크게 만들어서 바깥에도 그릴 수 있게
  const padding = Math.max(cw, ch) * 1.5; // content 양쪽으로 1.5배의 여백
  const worldW = cw + padding * 2;
  const worldH = ch + padding * 2;
  QUIZ_STATE.worldW = worldW;
  QUIZ_STATE.worldH = worldH;
  QUIZ_STATE.contentOffsetX = padding;
  QUIZ_STATE.contentOffsetY = padding;

  world.style.width = worldW + 'px';
  world.style.height = worldH + 'px';

  // content를 world 중앙에 위치시킴
  content.style.position = 'absolute';
  content.style.left = padding + 'px';
  content.style.top = padding + 'px';

  // memo 캔버스: world 전체 크기
  memo.width = worldW;
  memo.height = worldH;
  memo.style.width = worldW + 'px';
  memo.style.height = worldH + 'px';

  const ctx = memo.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  QUIZ_STATE.ctx = ctx;
}

// 화면에 맞추기 — content가 화면에 가능한 크게 들어가도록
function fitToScreen() {
  const stage = $('#solver-stage');
  if (!stage || !QUIZ_STATE.contentW) return;
  const stageRect = stage.getBoundingClientRect();
  const fitW = stageRect.width * 0.95;
  const fitH = stageRect.height * 0.95;
  const fit = Math.min(fitW / QUIZ_STATE.contentW, fitH / QUIZ_STATE.contentH, 2);
  QUIZ_STATE.zoom = fit;
  // content가 stage 중앙에 오도록 pan 계산
  // content는 world 안에서 (contentOffsetX, contentOffsetY)에 있음
  // world의 (0,0) 점이 화면에서 보이는 위치 = pan
  // content 중심이 화면 중심에 오려면:
  const contentCenterX = QUIZ_STATE.contentOffsetX + QUIZ_STATE.contentW / 2;
  const contentCenterY = QUIZ_STATE.contentOffsetY + QUIZ_STATE.contentH / 2;
  QUIZ_STATE.panX = stageRect.width / 2 - contentCenterX * fit;
  QUIZ_STATE.panY = stageRect.height / 2 - contentCenterY * fit;
  QUIZ_STATE._updateTransform();
}

function zoomBy(factor) {
  const stage = $('#solver-stage');
  const rect = stage.getBoundingClientRect();
  const focalX = rect.width / 2;
  const focalY = rect.height / 2;
  const oldZoom = QUIZ_STATE.zoom;
  const newZoom = Math.max(0.2, Math.min(8, oldZoom * factor));
  const scale = newZoom / oldZoom;
  QUIZ_STATE.zoom = newZoom;
  QUIZ_STATE.panX = QUIZ_STATE.panX + (1 - scale) * (focalX - QUIZ_STATE.panX);
  QUIZ_STATE.panY = QUIZ_STATE.panY + (1 - scale) * (focalY - QUIZ_STATE.panY);
  QUIZ_STATE._updateTransform();
}

function restoreMemoForCurrent() {
  if (!QUIZ_STATE.ctx) return;
  QUIZ_STATE.ctx.clearRect(0, 0, QUIZ_STATE.memo.width, QUIZ_STATE.memo.height);
  const data = QUIZ_STATE.memos?.[memoKey()];
  if (!data) return;
  const img = new Image();
  img.onload = () => {
    QUIZ_STATE.ctx.drawImage(img, 0, 0, QUIZ_STATE.memo.width, QUIZ_STATE.memo.height);
  };
  img.src = data;
}

function updateProgressDots() {
  const el = $('#qt-dots');
  if (!el) return;
  if (QUIZ_STATE.contentType === 'pdf') {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = QUIZ_STATE.questions.map((q, i) => {
    const answered = QUIZ_STATE.responses[q.id];
    const cls = ['quiz-progress-dot'];
    if (answered) cls.push('answered');
    if (i === QUIZ_STATE.currentIdx) cls.push('current');
    return `<div class="${cls.join(' ')}" data-i="${i}"></div>`;
  }).join('');
  el.querySelectorAll('.quiz-progress-dot').forEach(d => d.onclick = () => {
    saveCurrentMemo();
    showQuestion(parseInt(d.dataset.i));
  });
}

function updateSubmitButton() {
  const btn = $('#qt-submit');
  if (!btn) return;
  if (QUIZ_STATE.contentType === 'pdf') {
    const hasAns = !!(QUIZ_STATE.responses['main'] && QUIZ_STATE.responses['main'].trim());
    btn.disabled = !hasAns;
    btn.textContent = '제출';
    return;
  }
  const total = QUIZ_STATE.questions.length;
  const answered = QUIZ_STATE.questions.filter(q => QUIZ_STATE.responses[q.id]).length;
  const allDone = answered === total;
  btn.disabled = !allDone;
  btn.textContent = allDone ? '제출' : `제출 (${answered}/${total})`;
}

// === PDF 모드 ===
async function loadPdfMode() {
  if (!window.pdfjsLib) {
    await alertDialog('오류', 'PDF 로더가 로드되지 않았어요. 페이지를 새로고침해주세요.');
    return;
  }
  const content = $('#solver-content');
  content.innerHTML = `<div class="pdf-page-loading">PDF 로딩 중...</div>`;

  try {
    const loadingTask = window.pdfjsLib.getDocument(QUIZ_STATE.pdfUrl);
    const pdfDoc = await loadingTask.promise;
    QUIZ_STATE.pdfDoc = pdfDoc;
    QUIZ_STATE.pdfCurrentPage = 1;
    QUIZ_STATE.pdfTotalPages = pdfDoc.numPages;

    await renderPdfPage(1);
  } catch (e) {
    console.error('PDF 로드 실패:', e);
    content.innerHTML = `<div class="pdf-page-loading" style="color:var(--red);">PDF 로드 실패: ${esc(e.message)}</div>`;
  }
}

async function renderPdfPage(pageNum) {
  const pdfDoc = QUIZ_STATE.pdfDoc;
  if (!pdfDoc || pageNum < 1 || pageNum > pdfDoc.numPages) return;

  saveCurrentMemo();

  QUIZ_STATE.pdfCurrentPage = pageNum;

  const page = await pdfDoc.getPage(pageNum);
  const scale = 2.0; // 고해상도 렌더
  const viewport = page.getViewport({ scale });

  const content = $('#solver-content');
  content.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.className = 'pdf-page';
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = viewport.width + 'px';
  canvas.style.height = viewport.height + 'px';
  content.appendChild(canvas);

  const renderCtx = canvas.getContext('2d');
  await page.render({ canvasContext: renderCtx, viewport }).promise;

  QUIZ_STATE.contentW = viewport.width;
  QUIZ_STATE.contentH = viewport.height;
  setupWorld();
  fitToScreen();
  restoreMemoForCurrent();

  if ($('#pdf-page-info')) $('#pdf-page-info').textContent = `${pageNum} / ${pdfDoc.numPages}`;
  if ($('#qt-counter')) $('#qt-counter').textContent = `${pageNum} / ${pdfDoc.numPages}`;
}

function goPdfPage(n) {
  if (!QUIZ_STATE.pdfDoc) return;
  const total = QUIZ_STATE.pdfDoc.numPages;
  if (n < 1 || n > total) return;
  renderPdfPage(n);
}

function updateTimer() {
  if (!QUIZ_STATE || QUIZ_STATE.submitted) return;
  if (!QUIZ_STATE.timeLimit) return;
  const elapsed = (Date.now() - QUIZ_STATE.startedAt) / 1000;
  const remaining = Math.max(0, QUIZ_STATE.timeLimit - elapsed);
  const pct = Math.min(100, (elapsed / QUIZ_STATE.timeLimit) * 100);
  $('#qt-time').textContent = `${fmtTime(elapsed)} / ${fmtTime(QUIZ_STATE.timeLimit)}`;
  const fill = $('#qt-bar-fill');
  if (fill) {
    fill.style.width = pct + '%';
    if (remaining < 60) fill.classList.add('warning');
  }
  if (remaining <= 0) submitQuiz(true);
}

async function confirmSubmit() {
  if (QUIZ_STATE.contentType === 'pdf') {
    const hasAns = !!(QUIZ_STATE.responses['main'] && QUIZ_STATE.responses['main'].trim());
    if (!hasAns) return alertDialog('답안 미입력', '답안을 입력해야 제출할 수 있어요.');
    const ok = await confirmDialog('정말 제출하시겠어요?', `답안: ${QUIZ_STATE.responses['main']}\n제출 후엔 수정할 수 없어요.`, '제출', true);
    if (!ok) return;
    return submitQuiz(false);
  }
  const total = QUIZ_STATE.questions.length;
  const answered = QUIZ_STATE.questions.filter(q => QUIZ_STATE.responses[q.id]).length;
  if (answered < total) return alertDialog('아직 못 풀었어요', `${total}문항 중 ${answered}문항만 답안을 작성했습니다. 모든 문항을 풀어야 제출할 수 있어요.`);
  const ok = await confirmDialog('정말 제출하시겠어요?', `총 ${total}문항을 모두 작성했습니다. 제출 후엔 수정할 수 없어요.`, '제출', true);
  if (!ok) return;
  submitQuiz(false);
}

async function submitQuiz(isTimeout) {
  if (QUIZ_STATE.submitted) return;
  QUIZ_STATE.submitted = true;
  if (QUIZ_STATE.timer) clearInterval(QUIZ_STATE.timer);
  saveCurrentMemo();
  const elapsed = Math.floor((Date.now() - QUIZ_STATE.startedAt) / 1000);
  let score = 0;
  let total = 1;
  if (QUIZ_STATE.contentType === 'pdf') {
    // PDF 단일 답안 채점은 mock_exam answer_key와 비교 (나중 구현)
    total = 1;
  } else {
    total = QUIZ_STATE.questions.length;
    QUIZ_STATE.questions.forEach(q => {
      const ans = QUIZ_STATE.responses[q.id];
      if (ans && normalizeAns(ans) === normalizeAns(q.correct_answer)) score++;
    });
  }
  const tableName = QUIZ_STATE.mode === 'exam' ? 'exam_attempts' : 'quiz_attempts';
  const { error } = await sb.from(tableName).update({
    responses: QUIZ_STATE.responses,
    score, total,
    submitted_at: new Date().toISOString(),
    time_taken_seconds: elapsed
  }).eq('id', QUIZ_STATE.attempt.id);
  if (error) { await alertDialog('제출 실패', error.message); return; }
  if (isTimeout) await alertDialog('시간 종료', '제한 시간이 끝났어요. 자동으로 제출됩니다.');
  const route = QUIZ_STATE.mode === 'exam' ? `exams/result/${QUIZ_STATE.attempt.id}` : `quiz/result/${QUIZ_STATE.attempt.id}`;
  location.hash = '#/' + route;
}

async function renderPdfSolve(materialId) {
  if (isMentor()) { await alertDialog('알림', '멘토는 풀이 모드를 사용할 수 없어요.'); navigate(`materials/${materialId}`); return; }
  app().innerHTML = `<div class="loading">불러오는 중...</div>`;
  const { data: m } = await sb.from('materials').select('*').eq('id', materialId).maybeSingle();
  if (!m || !m.pdf_path) { await alertDialog('PDF 없음', 'PDF가 등록되지 않은 자료입니다.'); navigate(`materials/${materialId}`); return; }

  const ak = parseAnswerKey(m.answer_key);
  const allowed = new Set(m.allowed_labels || []);
  const allowedAk = ak.filter(r => allowed.has(r.label));

  const { data: existing } = await sb.from('submissions').select('*').eq('material_id', materialId).eq('user_id', CURRENT.id).maybeSingle();

  // 기존 답안 불러오기
  const responses = {};
  if (existing && existing.answers) {
    Object.assign(responses, existing.answers);
  }

  // PDF URL
  const { data: pub } = sb.storage.from('materials').getPublicUrl(m.pdf_path);
  const pdfUrl = pub.publicUrl;

  QUIZ_STATE = {
    mode: 'pdf-solve',
    material: m,
    materialId,
    pdfUrl,
    answerKey: allowedAk,
    responses: { ...responses },
    submitted: false,
    contentType: 'pdf',
    timer: null, timeLimit: 0, startedAt: Date.now(),

function setupVideoUpload() {
  const panel = $('#upload-panel'), zone = $('#v-zone'), input = $('#v-file');
  const sel = $('#v-selected'), prog = $('#v-progress'), fill = prog.querySelector('.progress-fill');
  let chosen = null;
  let xhr = null;
  $('#upload-open').onclick = () => { panel.style.display = 'block'; panel.scrollIntoView({behavior:'smooth', block:'start'}); };
  $('#v-cancel').onclick = () => {
    if (xhr) { try { xhr.abort(); } catch(_) {} xhr = null; }
    panel.style.display = 'none'; input.value = ''; sel.textContent = ''; chosen = null;
    prog.classList.remove('show'); fill.style.width = '0%';
    const btn = $('#v-submit'); btn.disabled = false; btn.textContent = '업로드 시작';
  };
  zone.onclick = e => { if (e.target !== input) input.click(); };
  input.onchange = e => { chosen = e.target.files[0]; if (chosen) sel.innerHTML = `선택됨: <strong>${esc(chosen.name)}</strong> (${fmtBytes(chosen.size)})`; };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragging'); };
  zone.ondragleave = () => zone.classList.remove('dragging');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragging'); chosen = e.dataTransfer.files[0]; if (chosen) sel.innerHTML = `선택됨: <strong>${esc(chosen.name)}</strong> (${fmtBytes(chosen.size)})`; };
  $('#v-submit').onclick = async () => {
    const title = $('#v-title').value.trim();
    const desc = $('#v-desc').value.trim();
    if (!title) return alertDialog('입력 오류', '제목을 입력해주세요.');
    if (!chosen) return alertDialog('파일 선택', '영상 파일을 선택해주세요.');
    const btn = $('#v-submit'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 업로드 중...';
    prog.classList.add('show'); fill.style.width = '0%';
    sel.innerHTML = `⏳ <strong>준비 중...</strong> (${fmtBytes(chosen.size)})`;

    try {
      // 세션 확인
      const { data: { session }, error: sErr } = await sb.auth.getSession();
      if (sErr || !session) throw new Error('세션 없음 — 다시 로그인해주세요');
      sel.innerHTML = `⏳ <strong>업로드 시작...</strong>`;

      const ext = (chosen.name.split('.').pop() || 'mp4').toLowerCase();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

      await uploadFileXHR('videos', path, chosen, chosen.type || 'video/mp4', (loaded, total) => {
        const pct = Math.round((loaded / total) * 95);
        fill.style.width = pct + '%';
        sel.innerHTML = `⏳ <strong>${pct}%</strong> · ${fmtBytes(loaded)} / ${fmtBytes(total)}`;
      });

      sel.innerHTML = `✓ <strong>업로드 완료, DB 저장 중...</strong>`;
      fill.style.width = '97%';

      const { error: insErr } = await sb.from('videos').insert({ title, description: desc||null, video_path: path, created_by: CURRENT.id });
      if (insErr) throw insErr;
      fill.style.width = '100%';
      sel.innerHTML = `✓ <strong>완료!</strong>`;
      xhr = null;
      setTimeout(render, 500);
    } catch (e) {
      xhr = null;
      console.error('[Video Upload]', e);
      btn.disabled = false; btn.textContent = '업로드 시작';
      prog.classList.remove('show'); fill.style.width = '0%';
      let msg = e.message || String(e);
      const ml = msg.toLowerCase();
      if (ml.includes('row-level') || ml.includes('rls') || ml.includes('policy') || ml.includes('unauthorized') || ml.includes('403')) {
        msg = '권한 오류 — setup.sql v4를 실행하고, 멘토로 재로그인했는지 확인해주세요.\n\n원본: ' + msg;
      } else if (ml.includes('exceeded') || ml.includes('size') || ml.includes('payload too large') || ml.includes('413')) {
        msg = '파일이 너무 큽니다. 2GB 이하로, setup.sql v4가 적용됐는지 확인해주세요.\n\n원본: ' + msg;
      }
      sel.innerHTML = `❌ <strong style="color:var(--red);">실패</strong>`;
      alertDialog('업로드 실패', msg);
    }
  };
}

let SCHED_STATE = { year: 0, month: 0, events: [] };

async function renderSchedule() {
  const ment = isMentor();
  if (!SCHED_STATE.year) { const n = new Date(); SCHED_STATE.year = n.getFullYear(); SCHED_STATE.month = n.getMonth(); }
  shell('schedule', `<div class="page-head fade-up fade-up-1"><div><div class="page-eyebrow">Class Calendar</div><h1 class="page-title"><em>시간표</em></h1></div><div style="font-size:13px;color:var(--muted);">${ment?'날짜를 클릭하면 수업 일정을 추가/관리할 수 있습니다.':'수업 예정일은 색이 표시됩니다.'}</div></div><div class="calendar-wrap fade-up fade-up-2"><div class="cal-head"><div class="cal-month" id="cal-month-label"></div><div class="cal-nav"><button id="cal-prev" title="이전 달">‹</button><button id="cal-today" style="width:auto;padding:0 14px;font-size:13px;">오늘</button><button id="cal-next" title="다음 달">›</button></div></div><div class="cal-grid" id="cal-grid"></div></div><div style="margin-top:24px;font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;">※ 일요일 빨간색 · 오늘 동그란 검은 표시 · <span style="display:inline-block;width:10px;height:10px;background:var(--burgundy);border-radius:2px;vertical-align:middle;"></span> 수업일</div>`);
  $('#cal-prev').onclick = async () => { SCHED_STATE.month--; if (SCHED_STATE.month<0) { SCHED_STATE.month=11; SCHED_STATE.year--; } await loadEvents(); drawCalendar(); };
  $('#cal-next').onclick = async () => { SCHED_STATE.month++; if (SCHED_STATE.month>11) { SCHED_STATE.month=0; SCHED_STATE.year++; } await loadEvents(); drawCalendar(); };
  $('#cal-today').onclick = async () => { const n = new Date(); SCHED_STATE.year=n.getFullYear(); SCHED_STATE.month=n.getMonth(); await loadEvents(); drawCalendar(); };
  await loadEvents();
  drawCalendar();
}

async function loadEvents() {
  const f = ymd(new Date(SCHED_STATE.year, SCHED_STATE.month, 1));
  const t = ymd(new Date(SCHED_STATE.year, SCHED_STATE.month + 1, 0));
  const { data } = await sb.from('schedule').select('*').gte('class_date', f).lte('class_date', t).order('class_date');
  SCHED_STATE.events = data || [];
}

function drawCalendar() {
  $('#cal-month-label').innerHTML = `${SCHED_STATE.year} <em>${String(SCHED_STATE.month+1).padStart(2,'0')}월</em>`;
  const grid = $('#cal-grid');
  const dows = ['일','월','화','수','목','금','토'];
  const first = new Date(SCHED_STATE.year, SCHED_STATE.month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(SCHED_STATE.year, SCHED_STATE.month+1, 0).getDate();
  const prevMonthDays = new Date(SCHED_STATE.year, SCHED_STATE.month, 0).getDate();
  const today = new Date();
  const isToday = (y,m,d) => y===today.getFullYear() && m===today.getMonth() && d===today.getDate();
  let html = dows.map((d,i) => `<div class="cal-dow ${i===0?'sun':''}">${d}</div>`).join('');
  for (let i = startDow-1; i >= 0; i--) html += `<div class="cal-day other"><div class="day-num">${prevMonthDays-i}</div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = (startDow + d - 1) % 7;
    const dateStr = ymd(new Date(SCHED_STATE.year, SCHED_STATE.month, d));
    const dayEv = SCHED_STATE.events.filter(e => e.class_date === dateStr);
    html += `<div class="cal-day ${dow===0?'sun':''} ${isToday(SCHED_STATE.year,SCHED_STATE.month,d)?'today':''}" data-date="${dateStr}"><div class="day-num">${d}</div>${dayEv.slice(0,2).map(e => `<div class="cls-pill">${esc(e.title||'수업')}</div>`).join('')}${dayEv.length>2?`<div class="cls-pill" style="background:var(--muted);">+${dayEv.length-2}</div>`:''}</div>`;
  }
  const totalCells = startDow + daysInMonth;
  const trail = (7 - totalCells % 7) % 7;
  for (let i = 1; i <= trail; i++) html += `<div class="cal-day other"><div class="day-num">${i}</div></div>`;
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-day[data-date]').forEach(c => c.onclick = () => openDay(c.dataset.date));
}

function openDay(dateStr) {
  const ment = isMentor();
  const dayEv = SCHED_STATE.events.filter(e => e.class_date === dateStr);
  const d = new Date(dateStr + 'T00:00:00');
  const dowStr = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()];
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop show';
  bd.innerHTML = `<div class="modal" style="max-width:500px;"><h3>${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}. <span style="color:var(--muted);font-size:15px;font-family:var(--mono);">${dowStr}</span></h3><p class="modal-sub">등록된 일정 ${dayEv.length}건</p><div id="day-events" style="margin-bottom:${ment?'18px':'0'};"></div>${ment?`<hr style="border:none;border-top:1px solid var(--line);margin:0 0 18px;"><div class="field"><label>새 일정 제목</label><input type="text" id="ne-t" placeholder="예: 수학 문제풀이 수업"></div><div class="field"><label>메모 (선택)</label><input type="text" id="ne-n" placeholder="준비물, 범위 등"></div><button class="btn" id="add-evt">＋ 이 날 수업 추가</button>`:(dayEv.length===0?`<div style="padding:12px;background:var(--paper-3);border-radius:6px;font-size:13px;color:var(--muted);text-align:center;">이 날은 수업 일정이 없습니다.</div>`:'')}<div class="modal-actions"><button class="btn btn-ghost" id="m-close">닫기</button></div></div>`;
  document.body.appendChild(bd);
  const close = () => bd.remove();
  bd.querySelector('#m-close').onclick = close;
  bd.onclick = e => { if (e.target === bd) close(); };
  const listEl = bd.querySelector('#day-events');
  const renderList = () => {
    if (dayEv.length === 0) { listEl.innerHTML = ment ? `<div style="padding:10px;background:var(--paper-3);border-radius:6px;font-size:13px;color:var(--muted);">아직 등록된 일정이 없습니다.</div>` : ''; return; }
    listEl.innerHTML = dayEv.map(e => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--paper-3);border-radius:6px;margin-bottom:6px;"><div><div style="font-weight:600;font-family:var(--serif);font-size:16px;">${esc(e.title||'수업')}</div>${e.notes?`<div style="font-size:12px;color:var(--muted);margin-top:2px;">${esc(e.notes)}</div>`:''}</div>${ment?`<button class="btn btn-small btn-danger" data-del="${e.id}">삭제</button>`:''}</div>`).join('');
    if (ment) listEl.querySelectorAll('button[data-del]').forEach(b => b.onclick = async () => {

      await sb.from('schedule').delete().eq('id', b.dataset.del);
      close(); await loadEvents(); drawCalendar();
    });
  };
  renderList();
  if (ment) {
    bd.querySelector('#add-evt').onclick = async () => {
      const title = bd.querySelector('#ne-t').value.trim();

      if (error) return alertDialog('추가 실패', error.message);
      close(); await loadEvents(); drawCalendar();
    };

async function renderExamList() {

function openAddExamSessionModal() {

function setupExamQuestionUpload(sessionId) {
  const zone = $('#eq-zone'), input = $('#eq-file'), prog = $('#eq-progress'), preview = $('#eq-preview');
  let chosen = null;
  zone.onclick = e => { if (e.target !== input) input.click(); };
  input.onchange = e => { chosen = e.target.files[0]; if (chosen) preview.innerHTML = `선택됨: <strong>${esc(chosen.name)}</strong> (${fmtBytes(chosen.size)})`; };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragging'); };
  zone.ondragleave = () => zone.classList.remove('dragging');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragging'); chosen = e.dataTransfer.files[0]; if (chosen) preview.innerHTML = `선택됨: <strong>${esc(chosen.name)}</strong> (${fmtBytes(chosen.size)})`; };
  $('#eq-save').onclick = async () => {
    const label = $('#eq-label').value.trim();
    const ans = $('#eq-ans').value.trim();
    if (!label) return alertDialog('입력 필요', '문항 번호를 입력해주세요.');
    if (!ans) return alertDialog('입력 필요', '정답을 입력해주세요.');
    const btn = $('#eq-save'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 추가 중...';
    prog.classList.add('show');
    const fill = prog.querySelector('.progress-fill'); fill.style.width = '0%';
    try {
      let imagePath = null;
      if (chosen) {
        const ext = (chosen.name.split('.').pop() || 'jpg').toLowerCase();
        imagePath = `${sessionId}/q_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        await uploadFileXHR('exam-files', imagePath, chosen, chosen.type || 'image/jpeg', (loaded, total) => {
          const pct = Math.round((loaded / total) * 95);
          fill.style.width = pct + '%';
        });
      }
      const { data: existing } = await sb.from('exam_questions').select('q_order').eq('session_id', sessionId).order('q_order', { ascending: false }).limit(1);
      const nextOrder = (existing?.[0]?.q_order ?? -1) + 1;
      const { error: insErr } = await sb.from('exam_questions').insert({ session_id: sessionId, image_path: imagePath, label, correct_answer: ans, q_order: nextOrder });
      if (insErr) throw insErr;
      fill.style.width = '100%';
      setTimeout(render, 300);
    } catch (e) {
      prog.classList.remove('show'); fill.style.width = '0%';
      btn.disabled = false; btn.innerHTML = '＋ 문제 추가';
      console.error(e);
      let msg = e.message || String(e);
      const ml = msg.toLowerCase();
      if (ml.includes('row-level') || ml.includes('rls') || ml.includes('policy') || ml.includes('403')) msg = '권한 오류 — 멘토 재로그인 후 시도해주세요.\n\n원본: ' + msg;
      else if (ml.includes('exceeded') || ml.includes('size') || ml.includes('413')) msg = '파일이 너무 큽니다 (2GB 초과).\n\n원본: ' + msg;
      alertDialog('추가 실패', msg);
    }
  };
}

function drawMyExamAttempts(attempts, questions) {

async function renderExamAnalysis(sessionId, questions) {
  const w = $('#exam-analysis');
  if (!questions || questions.length === 0) { w.innerHTML = ''; return; }
  w.innerHTML = `<div class="section"><div class="section-head"><h2 class="section-title">응시 분석</h2><span class="section-sub">Mentor Analytics</span></div><div class="tabs"><button class="tab active" data-tab="mentee">개별 멘티 분석</button><button class="tab" data-tab="question">문항별 분석</button></div><div id="ea-body"><div class="loading">분석 중...</div></div></div>`;
  const { data: attempts } = await sb.from('exam_attempts').select('*, profiles(username)').eq('session_id', sessionId).not('submitted_at', 'is', null).order('submitted_at', { ascending: false });
  const qMap = {};
  questions.forEach((q, i) => { qMap[q.id] = { ...q, index: i+1 }; });

  const drawMentee = () => {
    const body = $('#ea-body');
    if (!attempts || attempts.length === 0) { body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 응시 기록이 없어요.</div>`; return; }
    const byUser = {};
    attempts.forEach(a => { const u = a.profiles?.username || '?'; if (!byUser[u]) byUser[u] = []; byUser[u].push(a); });
    body.innerHTML = Object.keys(byUser).map(u => {
      const userAttempts = byUser[u];
      return userAttempts.map((a, idx) => {
        const wrongs = [];
        questions.forEach(q => {
          const studentAns = a.responses?.[q.id];
          if (!studentAns || normalizeAns(studentAns) !== normalizeAns(q.correct_answer)) wrongs.push({ label: q.label, studentAns: studentAns || '미제출', correct: q.correct_answer });
        });
        const pct = a.total ? Math.round(a.score/a.total*100) : 0;
        return `<div class="mentee-row" data-id="${a.id}"><div class="mentee-row-head"><div><div class="mentee-row-name">${esc(u)} <span style="color:var(--muted);font-size:13px;font-family:var(--mono);">— ${userAttempts.length - idx}회차</span></div><div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;">${fmtDateTime(a.submitted_at)} · ${fmtTime(a.time_taken_seconds||0)}</div></div><div class="mentee-row-score"><span>${a.score}</span><span style="color:var(--muted);font-size:14px;"> / ${a.total}</span> · ${pct}%</div></div><div class="mentee-row-detail">${wrongs.length === 0 ? `<div style="color:var(--green);font-family:var(--mono);font-size:12px;">🎉 만점!</div>` : `<div style="font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;">틀린 문항 (문항 · 멘티답 → 정답)</div><div class="wrong-list">${wrongs.map(w => `<div class="wrong-item">${esc(w.label)} : ${esc(w.studentAns)} → ${esc(w.correct)}</div>`).join('')}</div>`}</div></div>`;
      }).join('');
    }).join('');
    body.querySelectorAll('.mentee-row').forEach(row => row.onclick = () => row.classList.toggle('expanded'));
  };
  const drawQuestion = () => {
    const body = $('#ea-body');
    if (!attempts || attempts.length === 0) { body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 응시 기록이 없어요.</div>`; return; }
    const stats = questions.map(q => {
      const wrongMentees = [];
      let attemptCount = 0;
      attempts.forEach(a => {
        attemptCount++;
        const ans = a.responses?.[q.id];
        if (!ans || normalizeAns(ans) !== normalizeAns(q.correct_answer)) wrongMentees.push(a.profiles?.username || '?');
      });
      const wrongRate = attemptCount > 0 ? wrongMentees.length / attemptCount : 0;
      return { label: q.label, correct: q.correct_answer, wrongMentees, total: attemptCount, wrongRate };
    });
    stats.sort((a, b) => b.wrongRate - a.wrongRate);
    body.innerHTML = `<div style="font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;">오답률 높은 순 정렬 · 총 응시 ${attempts.length}회</div>${stats.map(s => {
      const pct = Math.round(s.wrongRate * 100);
      return `<div class="q-stat-row"><div class="q-stat-label">${esc(s.label)}<div style="font-size:10px;color:var(--muted);font-weight:400;">정답: ${esc(s.correct)}</div></div><div class="q-stat-bar"><div class="q-stat-fill ${pct>=50?'danger':''}" style="width:${pct}%"></div></div><div class="q-stat-rate">${s.wrongMentees.length}/${s.total} <span style="color:${pct>=50?'var(--red)':'var(--muted)'};">(${pct}%)</span></div>${s.wrongMentees.length > 0 ? `<div class="q-stat-mentees">틀린 멘티: ${s.wrongMentees.map(u => `<span>${esc(u)}</span>`).join('')}</div>` : ''}</div>`;
    }).join('')}`;
  };
  drawMentee();
  w.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    w.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    if (t.dataset.tab === 'mentee') drawMentee(); else drawQuestion();
  });
}

async function renderExamTake(sessionId) {
  if (isMentor()) { await alertDialog('알림', '멘토는 응시할 수 없습니다.'); navigate('exams'); return; }
  app().innerHTML = `<div class="loading">불러오는 중...</div>`;
  const { data: session } = await sb.from('exam_sessions').select('*').eq('id', sessionId).maybeSingle();
  if (!session) { navigate('exams'); return; }
  const { data: questions } = await sb.from('exam_questions').select('*').eq('session_id', sessionId).order('q_order').order('created_at');
  if (!questions || questions.length === 0) { await alertDialog('문제 없음', '아직 문제가 등록되지 않았어요.'); navigate(`exams/${sessionId}`); return; }
  const { data: attempt, error: aErr } = await sb.from('exam_attempts').insert({ session_id: sessionId, user_id: CURRENT.id, responses: {}, total: questions.length, started_at: new Date().toISOString() }).select().single();
  if (aErr) { await alertDialog('시작 실패', aErr.message); navigate(`exams/${sessionId}`); return; }

  // 이미지가 있으면 그 url, 없으면 PDF 안내 placeholder
  const pdfUrl = session.pdf_path ? sb.storage.from('exam-files').getPublicUrl(session.pdf_path).data.publicUrl : null;
  const placeholderImg = makePlaceholderImage(session.title, pdfUrl);

  const images = questions.map(q => {
    if (q.image_path) return { url: sb.storage.from('exam-files').getPublicUrl(q.image_path).data.publicUrl };
    return { url: placeholderImg };
  });

  QUIZ_STATE = {
    mode: 'exam', session, questions, attempt, responses: {},
    currentIdx: 0, startedAt: Date.now(), timeLimit: session.time_limit_seconds,
    timer: null, submitted: false,
    images,
    questionLabels: questions.map(q => q.label),
    answerHint: '예: ① ② ③ 또는 1, 2 / 단답',
    answerPlaceholder: '정답 입력'
  };
  buildTakeUI();

  // PDF가 있으면 풀스크린 위에 다운로드/새창보기 버튼 추가
  if (pdfUrl) {
    const tools = document.querySelector('.quiz-memo-tools');
    if (tools) {
      const div = document.createElement('div');
      div.className = 'tool-divider';
      tools.appendChild(div);
      const btn = document.createElement('button');
      btn.title = 'PDF 새 창에서 열기';
      btn.textContent = '📄';
      btn.onclick = (e) => { e.preventDefault(); window.open(pdfUrl, '_blank'); };
      tools.appendChild(btn);
    }
  }
}

// PDF만 있는 경우의 placeholder 이미지 데이터 URL
function makePlaceholderImage(title, pdfUrl) {
  const c = document.createElement('canvas');
  c.width = 800; c.height = 600;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FAF7F0';
  ctx.fillRect(0, 0, 800, 600);
  ctx.fillStyle = '#3F3A33';
  ctx.font = '600 28px serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, 400, 200);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#78716C';
  ctx.fillText('이 문제는 별도 이미지가 없습니다.', 400, 260);
  ctx.fillText('우측 상단 📄 버튼으로 PDF를 새 창에서 열어 풀어주세요.', 400, 290);
  ctx.fillText('이 캔버스에는 자유롭게 메모할 수 있습니다.', 400, 320);
  return c.toDataURL('image/png');
}

async function renderExamResult(attemptId) {
  shell('exams', `<div class="loading">불러오는 중...</div>`);
  const { data: attempt } = await sb.from('exam_attempts').select('*, exam_sessions(title, id)').eq('id', attemptId).maybeSingle();
  if (!attempt) return shell('exams', `<a class="detail-back" href="#/exams">← 목록으로</a><div class="empty-state">결과를 찾을 수 없습니다.</div>`);
  const { data: questions } = await sb.from('exam_questions').select('*').eq('session_id', attempt.session_id).order('q_order').order('created_at');
  const pct = attempt.total ? Math.round(attempt.score/attempt.total*100) : 0;
  shell('exams', `<a class="detail-back" href="#/exams/${attempt.session_id}">← ${esc(attempt.exam_sessions.title)}</a><div class="result-summary fade-up fade-up-1"><div class="dday-label">EXAM COMPLETE</div><div class="result-score"><em>${attempt.score}</em> / ${attempt.total}</div><div style="font-family:var(--serif);font-size:32px;color:var(--gold);">${pct}%</div><div class="result-meta"><div>제출 · ${fmtDateTime(attempt.submitted_at)}</div><div>소요 · ${fmtTime(attempt.time_taken_seconds||0)}</div></div></div><div class="section fade-up fade-up-2"><div class="section-head"><h2 class="section-title">문항별 결과</h2><span class="section-sub">Detail</span></div><div class="result-q-grid">${questions.map(q => {
    const ans = attempt.responses?.[q.id] || '';
    const correct = normalizeAns(ans) === normalizeAns(q.correct_answer) && ans;
    return `<div class="result-q-card ${correct?'correct':'wrong'}"><div class="rq-num">${esc(q.label)}</div><div class="rq-ans">${esc(ans || '미제출')}</div>${correct ? `<div class="rq-correct">✓ 정답</div>` : `<div class="rq-wrong">✗ 정답: ${esc(q.correct_answer)}</div>`}</div>`;
  }).join('')}</div></div><div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;"><a class="btn btn-ghost" href="#/exams/${attempt.session_id}" style="width:auto;">← 모의고사로</a><a class="btn btn-primary-soft" href="#/exams/take/${attempt.session_id}" style="width:auto;">다시 응시 →</a></div>`);
}

async function renderDiag() {
  if (!CURRENT) { navigate('login'); return; }
  shell('home', `<div class="page-head fade-up fade-up-1"><div><div class="page-eyebrow">Diagnostics</div><h1 class="page-title"><em>진단</em></h1></div><a href="#/home" class="btn btn-small btn-ghost">← 홈으로</a></div><div class="section fade-up fade-up-2"><div class="section-head"><h2 class="section-title">현재 상태</h2></div><div id="diag-body"><div class="loading">검사 중...</div></div></div><div class="section fade-up fade-up-3" style="margin-top:24px;"><div class="section-head"><h2 class="section-title">업로드 직접 테스트</h2></div><div style="font-size:13px;color:var(--muted);margin-bottom:10px;">아주 작은 텍스트 파일을 'materials' 버킷에 업로드 시도합니다.</div><button class="btn" id="diag-upload">테스트 업로드 실행</button><div id="diag-upload-result" style="margin-top:12px;"></div></div><div class="section fade-up fade-up-4" style="margin-top:24px;"><div class="section-head"><h2 class="section-title">조치</h2></div><button class="btn btn-ghost" id="diag-refresh" style="margin-bottom:8px;">🔄 세션 강제 새로고침</button><button class="btn btn-danger" id="diag-relogin" style="margin-bottom:8px;">🚪 로그아웃하고 다시 로그인</button><div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;">세션 role이 stale일 수 있어요. 위 버튼을 차례로 시도해보세요.</div></div>`);

  const body = $('#diag-body');
  const lines = [];
  const { data: { session } } = await sb.auth.getSession();
  const { data: { user } } = await sb.auth.getUser();
  lines.push(`<div><strong>1. session user.id:</strong> <code style="font-family:var(--mono);font-size:11px;word-break:break-all;">${user?.id || '없음'}</code></div>`);
  lines.push(`<div><strong>   email:</strong> <code style="font-family:var(--mono);font-size:11px;">${user?.email || '없음'}</code></div>`);
  lines.push(`<div style="margin-top:10px;"><strong>2. CURRENT.role (클라이언트 캐시):</strong> <code style="color:${CURRENT.role==='mentor'?'var(--green)':'var(--red)'};font-weight:700;">${CURRENT.role}</code></div>`);
  lines.push(`<div>   CURRENT.username: <code style="font-family:var(--mono);">${esc(CURRENT.username)}</code></div>`);
  if (user) {
    const { data: freshProfile, error: pErr } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (pErr) lines.push(`<div style="margin-top:10px;color:var(--red);"><strong>3. profiles 조회 에러:</strong> ${esc(pErr.message)}</div>`);
    else if (!freshProfile) lines.push(`<div style="margin-top:10px;color:var(--red);"><strong>3. DB에 profile 없음! 이게 문제입니다.</strong></div>`);
    else {
      lines.push(`<div style="margin-top:10px;"><strong>3. DB profiles.role:</strong> <code style="color:${freshProfile.role==='mentor'?'var(--green)':'var(--red)'};font-weight:700;">${freshProfile.role}</code></div>`);
      lines.push(`<div>   DB profiles.id matches user.id: <code style="color:${freshProfile.id===user.id?'var(--green)':'var(--red)'};">${freshProfile.id === user.id ? 'YES ✓' : 'NO ✗'}</code></div>`);
    }
  }
  body.innerHTML = lines.join('');

  $('#diag-upload').onclick = async () => {
    const result = $('#diag-upload-result');
    result.innerHTML = `<div class="loading" style="padding:14px;">업로드 시도 중...</div>`;
    try {
      const blob = new Blob(['scholaria diag'], { type: 'text/plain' });
      const file = new File([blob], 'diag.txt', { type: 'text/plain' });
      const path = `__diag/${Date.now()}.txt`;
      const { data, error } = await sb.storage.from('materials').upload(path, file, { upsert: true });
      if (error) {
        result.innerHTML = `<div style="padding:14px;background:rgba(192,57,43,.10);border-left:3px solid var(--red);border-radius:4px;color:var(--red);font-family:var(--mono);font-size:12px;line-height:1.6;word-break:break-all;"><strong>❌ 업로드 실패</strong><br><br>message: ${esc(error.message)}<br><br>statusCode: ${esc(String(error.statusCode || error.status || '?'))}<br><br>error: ${esc(error.error || '?')}<br><br>전체: ${esc(JSON.stringify(error))}</div>`;
      } else {
        result.innerHTML = `<div style="padding:14px;background:rgba(39,174,96,.12);border-left:3px solid var(--green);border-radius:4px;color:var(--green);">✓ 업로드 성공! path = ${esc(data.path)}<br>이제 PDF/영상 업로드도 작동할 거예요.</div>`;
        sb.storage.from('materials').remove([path]);
      }
    } catch (e) {
      result.innerHTML = `<div style="padding:14px;background:rgba(192,57,43,.10);border-left:3px solid var(--red);border-radius:4px;color:var(--red);font-family:var(--mono);font-size:12px;word-break:break-all;"><strong>❌ 예외</strong><br>${esc(e.message)}</div>`;
    }
  };

  $('#diag-refresh').onclick = async () => {
    const { error } = await sb.auth.refreshSession();
    if (error) await alertDialog('새로고침 실패', error.message);
    else { CURRENT = await loadProfile(); await alertDialog('완료', '세션이 새로고침되었어요.'); render(); }
  };
  $('#diag-relogin').onclick = async () => {
    if (!await confirmDialog('로그아웃?', '다시 로그인하면 세션이 완전히 갱신됩니다.', '로그아웃')) return;
    await signOut();
  };
}
