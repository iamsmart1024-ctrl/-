<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Scholaria · 멘토링 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window['pdfjsLib']) {
    window['pdfjsLib'].GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
:root{--paper:#F5F0E6;--paper-2:#FAF7F0;--paper-3:#EDE6D6;--ink:#1C1917;--ink-2:#3F3A33;--muted:#78716C;--line:#D6CFC0;--line-2:#BFB5A0;--burgundy:#8B2635;--burgundy-d:#6B1D2A;--gold:#B8923D;--red:#C0392B;--green:#27AE60;--shadow-sm:0 1px 2px rgba(28,25,23,.05);--shadow-md:0 4px 14px rgba(28,25,23,.08);--shadow-lg:0 12px 40px rgba(28,25,23,.12);--r-sm:6px;--r-md:10px;--r-lg:18px;--serif:'Gowun Batang','Fraunces',Georgia,serif;--sans:'Pretendard Variable',Pretendard,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);background:var(--paper);background-image:radial-gradient(ellipse 1200px 600px at 20% 0%,rgba(184,146,61,.06),transparent 60%),radial-gradient(ellipse 1000px 500px at 100% 100%,rgba(139,38,53,.04),transparent 60%);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
a{color:inherit}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;position:relative;z-index:1}
.auth-hero{padding:64px 72px;background:linear-gradient(180deg,rgba(28,25,23,0) 0%,rgba(28,25,23,.04) 100%),var(--paper-2);border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.auth-hero::after{content:'';position:absolute;right:-180px;bottom:-180px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(139,38,53,.10),transparent 65%);pointer-events:none}
.brand{display:flex;align-items:baseline;gap:12px}
.brand-mark{font-family:var(--serif);font-style:italic;font-weight:500;font-size:28px;color:var(--burgundy);letter-spacing:-.01em}
.hero-main{margin:40px 0 0}
.hero-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(38px,5vw,58px);line-height:1.12;letter-spacing:-.02em;margin:0 0 22px}
.hero-title em{font-style:italic;color:var(--burgundy);font-family:'Fraunces',serif;font-weight:400}
.hero-sub{font-size:16px;line-height:1.7;color:var(--ink-2);max-width:460px}
.hero-meta{display:flex;gap:28px;padding-top:24px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.hero-meta div span{color:var(--ink);margin-left:6px}
.auth-panel{padding:72px 56px;display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:380px}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:32px}
.auth-tab{background:none;border:none;padding:12px 0;margin-right:28px;font-family:var(--serif);font-size:18px;color:var(--muted);position:relative;transition:color .2s}
.auth-tab.active{color:var(--ink)}
.auth-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--burgundy)}
.field{margin-bottom:18px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field label .hint{text-transform:none;letter-spacing:0;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);transition:border-color .15s,background .15s}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);border-radius:var(--r-sm);font-size:14px;font-weight:500;letter-spacing:-.005em;transition:transform .12s,background .15s,color .15s;width:100%}
.btn:hover{background:var(--burgundy);border-color:var(--burgundy)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn-ghost:hover{background:var(--paper-3);color:var(--ink);border-color:var(--ink)}
.btn-small{padding:8px 14px;font-size:13px;width:auto}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--line-2)}
.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-primary-soft{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
.auth-note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
.error-msg{margin-top:12px;padding:10px 12px;background:rgba(192,57,43,.08);border-left:3px solid var(--red);color:var(--red);font-size:13px;border-radius:4px;display:none;line-height:1.5}
.error-msg.show{display:block}
.success-msg{margin-top:12px;padding:10px 12px;background:rgba(39,174,96,.10);border-left:3px solid var(--green);color:var(--green);font-size:13px;border-radius:4px;display:none}
.success-msg.show{display:block}
@media(max-width:900px){.auth-wrap{grid-template-columns:1fr}.auth-hero{padding:40px 28px;border-right:none;border-bottom:1px solid var(--line)}.auth-panel{padding:40px 28px}}
.app-shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr;position:relative;z-index:1}
.sidebar{background:var(--paper-2);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-brand{font-family:var(--serif);font-size:22px;letter-spacing:-.01em;color:var(--ink);padding:0 10px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.side-brand em{font-family:'Fraunces',serif;font-style:italic;color:var(--burgundy);font-size:24px}
.side-nav{margin-top:24px;display:flex;flex-direction:column;gap:3px}
.nav-heading{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-size:14px;transition:background .15s,color .15s;cursor:pointer;background:none;border:none;text-align:left;width:100%}
.nav-link:hover{background:var(--paper-3);color:var(--ink)}
.nav-link.active{background:var(--ink);color:var(--paper-2)}
.nav-link.active .nav-dot{background:var(--gold)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.side-footer{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
.user-chip{display:flex;align-items:center;gap:10px;padding:10px;background:var(--paper-3);border-radius:var(--r-sm)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper-2);display:grid;place-items:center;font-family:var(--serif);font-size:16px}
.user-avatar.mentor{background:var(--burgundy)}
.user-name{font-size:13px;font-weight:600;color:var(--ink)}
.user-role{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.logout-btn{margin-top:10px;width:100%;padding:8px;font-size:12px;background:transparent;border:1px solid var(--line-2);border-radius:var(--r-sm);color:var(--muted);transition:all .15s}
.logout-btn:hover{color:var(--burgundy);border-color:var(--burgundy)}
.main{padding:40px 48px 80px;max-width:1280px}
.page-head{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.page-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.page-title{font-family:var(--serif);font-size:42px;font-weight:400;line-height:1.1;letter-spacing:-.02em;margin:0;color:var(--ink)}
.page-title em{font-family:'Fraunces',serif;font-style:italic;color:var(--burgundy);font-weight:400}
.dday-hero{background:var(--ink);color:var(--paper-2);border-radius:var(--r-lg);padding:44px 48px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:32px;margin-bottom:36px;overflow:hidden;position:relative}
.dday-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:360px;height:360px;background:radial-gradient(circle,rgba(184,146,61,.25),transparent 65%);pointer-events:none}
.dday-label{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.dday-title{font-family:var(--serif);font-size:28px;font-weight:400;margin:0 0 4px}
.dday-title em{font-family:'Fraunces',serif;font-style:italic;color:var(--gold);font-weight:400}
.dday-sub{color:rgba(245,240,230,.6);font-size:14px;margin:6px 0 0}
.dday-count{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(72px,11vw,140px);line-height:1;letter-spacing:-.04em;color:var(--paper-2);position:relative;z-index:1}
.dday-count sup{font-size:.25em;vertical-align:top;color:var(--gold);font-family:var(--mono);letter-spacing:.2em;margin-left:4px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.home-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;text-decoration:none;color:inherit;transition:all .2s;position:relative;overflow:hidden;cursor:pointer;display:block}
.home-card:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:var(--shadow-md)}
.home-card .card-num{font-family:'Fraunces',serif;font-style:italic;font-size:42px;color:var(--burgundy);line-height:1;margin-bottom:12px}
.home-card h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 6px}
.home-card p{margin:0;color:var(--muted);font-size:13px}
.home-card .card-arrow{position:absolute;right:20px;bottom:20px;font-size:18px;color:var(--muted);transition:transform .2s}
.home-card:hover .card-arrow{transform:translateX(4px);color:var(--burgundy)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.item-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;cursor:pointer;text-decoration:none;color:inherit;transition:all .15s;display:flex;flex-direction:column;gap:14px;position:relative}
.item-card:hover{border-color:var(--ink);box-shadow:var(--shadow-md)}
.item-tag{align-self:flex-start;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--burgundy);padding:3px 8px;border:1px solid var(--burgundy);border-radius:2px}
.item-title{font-family:var(--serif);font-size:20px;font-weight:400;margin:0;color:var(--ink);line-height:1.3}
.item-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.empty-state{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-md);background:var(--paper-2)}
.empty-state .em-icon{font-family:'Fraunces',serif;font-style:italic;font-size:54px;color:var(--line-2);margin-bottom:10px}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:20px;font-family:var(--mono);letter-spacing:.05em;cursor:pointer;background:none;border:none;padding:0}
.detail-back:hover{color:var(--burgundy)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.section{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);padding:26px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.section-title{font-family:var(--serif);font-size:20px;font-weight:400;margin:0}
.section-sub{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
.subhead{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.file-badge{display:flex;align-items:center;gap:12px;padding:14px;background:var(--paper-3);border-radius:var(--r-sm);border:1px solid var(--line);flex-wrap:wrap}
.file-icon{width:40px;height:48px;background:var(--burgundy);color:#fff;font-family:var(--mono);font-weight:700;font-size:11px;display:grid;place-items:center;border-radius:3px;flex-shrink:0}
.file-meta{flex:1;min-width:0}
.file-name{font-size:14px;font-weight:500;color:var(--ink);word-break:break-all}
.file-size{font-size:11px;color:var(--muted);font-family:var(--mono)}
.upload-zone{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:20px;text-align:center;background:var(--paper-3);cursor:pointer;transition:all .15s;display:block}
.upload-zone:hover{border-color:var(--ink);background:var(--paper-2)}
.upload-zone.dragging{border-color:var(--burgundy);background:var(--paper-2)}
.upload-zone input[type=file]{display:none}
.upload-zone .uz-title{font-size:14px;margin-bottom:4px;color:var(--ink)}
.upload-zone .uz-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.progress-bar{height:4px;background:var(--paper-3);border-radius:2px;overflow:hidden;margin-top:10px;display:none}
.progress-bar.show{display:block}
.progress-fill{height:100%;background:var(--burgundy);width:0%;transition:width .2s}
.label-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:center}
.label-row input{padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:4px;font-family:var(--serif);font-size:14px}
.label-row input:focus{outline:none;border-color:var(--ink)}
.label-row .lr-label{font-family:var(--mono)}
.label-row button{padding:8px;background:transparent;border:1px solid var(--line-2);border-radius:4px;color:var(--muted);font-size:11px;cursor:pointer}
.label-row button:hover{color:var(--red);border-color:var(--red)}
.answers-flex{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.answer-box{flex:0 0 calc((100% - 30px)/4);min-width:90px;display:flex;flex-direction:column;gap:4px;padding:10px;background:var(--paper-3);border:1px solid var(--line);border-radius:var(--r-sm);text-align:center;transition:all .15s}
@media(min-width:900px){.answer-box{flex:0 0 calc((100% - 50px)/6);min-width:80px}}
.answer-box.locked{opacity:.35;filter:grayscale(1)}
.answer-box .slot-num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;word-break:break-all}
.answer-box input{width:100%;padding:6px 4px;font-size:15px;font-weight:600;text-align:center;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--ink);font-family:var(--serif)}
.answer-box input:focus{outline:none;border-color:var(--ink)}
.answer-box.correct{background:rgba(39,174,96,.12);border-color:var(--green)}
.answer-box.correct .slot-num{color:var(--green)}
.answer-box.wrong{background:rgba(192,57,43,.10);border-color:var(--red)}
.answer-box.wrong .slot-num{color:var(--red)}
.answer-box .correct-mark{font-family:var(--mono);font-size:10px;color:var(--muted)}
.score-display{padding:18px;background:var(--ink);color:var(--paper-2);border-radius:var(--r-md);margin-top:16px;display:flex;justify-content:space-between;align-items:center}
.score-big{font-family:'Fraunces',serif;font-size:36px;font-weight:400;line-height:1}
.score-big span{color:var(--gold)}
.score-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,240,230,.6);margin-bottom:4px}
.label-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.label-chip{padding:6px 10px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--paper-3);border-radius:4px;font-family:var(--mono);font-size:12px;cursor:pointer;user-select:none;transition:all .12s;min-height:32px}
.label-chip.selected{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.label-chip:hover{border-color:var(--ink)}
.range-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.range-row input{padding:9px 12px;border:1px solid var(--line);background:var(--paper-2);border-radius:var(--r-sm);font-family:var(--mono)}
.analysis-section{margin-top:32px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:none;padding:10px 18px;font-family:var(--serif);font-size:16px;color:var(--muted);position:relative;cursor:pointer}
.tab.active{color:var(--ink)}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--burgundy)}
.mentee-row{padding:14px;background:var(--paper-3);border-radius:var(--r-sm);margin-bottom:8px;cursor:pointer;transition:background .15s}
.mentee-row:hover{background:var(--paper-2)}
.mentee-row-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.mentee-row-name{font-family:var(--serif);font-size:17px;font-weight:600}
.mentee-row-score{font-family:'Fraunces',serif;font-size:22px}
.mentee-row-score span{color:var(--burgundy)}
.mentee-row-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none}
.mentee-row.expanded .mentee-row-detail{display:block}
.wrong-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wrong-item{padding:4px 10px;background:rgba(192,57,43,.10);border:1px solid var(--red);color:var(--red);font-family:var(--mono);font-size:11px;border-radius:3px}
.q-stat-row{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;padding:12px;background:var(--paper-3);border-radius:var(--r-sm);margin-bottom:6px}
.q-stat-label{font-family:var(--mono);font-weight:600;color:var(--ink)}
.q-stat-bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.q-stat-fill{height:100%;background:var(--green);transition:width .3s}
.q-stat-fill.danger{background:var(--red)}
.q-stat-rate{font-family:var(--mono);font-size:13px;color:var(--ink)}
.q-stat-mentees{margin-top:8px;font-size:12px;color:var(--muted);grid-column:1/-1}
.q-stat-mentees span{padding:2px 6px;background:rgba(192,57,43,.10);color:var(--red);border-radius:3px;margin-right:4px;font-family:var(--mono);font-size:11px}
.video-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:all .2s}
.video-card:hover{border-color:var(--ink);box-shadow:var(--shadow-md)}
.video-card video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.video-info{padding:16px 18px}
.video-title{font-family:var(--serif);font-size:18px;margin:0 0 6px}
.video-desc{color:var(--muted);font-size:13px;margin:0}
.video-actions{padding:0 18px 16px;display:flex;gap:8px}
.calendar-wrap{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-md);padding:26px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cal-month{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.01em}
.cal-month em{font-family:'Fraunces',serif;font-style:italic;color:var(--burgundy)}

const SUNEUNG_DATE = new Date('2026-11-19T08:40:00+09:00');

const $ = s => document.querySelector(s);
const app = () => $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate = d => { d = new Date(d); return `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}.`; };
const fmtDateTime = d => { d = new Date(d); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const fmtBytes = b => !b ? '' : b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(1)+' KB' : b<1073741824 ? (b/1048576).toFixed(1)+' MB' : (b/1073741824).toFixed(2)+' GB';
const fmtTime = sec => { sec = Math.max(0, Math.floor(sec)); const m = Math.floor(sec/60), s = sec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; };
function computeDday() { const t = new Date(); const a = new Date(t.getFullYear(),t.getMonth(),t.getDate()); const b = new Date(SUNEUNG_DATE.getFullYear(),SUNEUNG_DATE.getMonth(),SUNEUNG_DATE.getDate()); return Math.round((b-a)/86400000); }
function normalizeAns(v) { if (v == null) return ''; const map = {'①':'1','②':'2','③':'3','④':'4','⑤':'5'}; return String(v).trim().split('').map(c => map[c] || c).join('').toLowerCase(); }
function isNetworkError(err) { if (!err) return false; const m = (err.message||'').toLowerCase(); return m.includes('load failed')||m.includes('failed to fetch')||m.includes('networkerror'); }

function confirmDialog(title, sub, okText='확인', danger=false) {
  return new Promise(resolve => {
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop show';
    bd.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p class="modal-sub">${esc(sub)}</p><div class="modal-actions"><button class="btn btn-ghost" id="c-cancel">취소</button><button class="btn ${danger?'btn-primary-soft':''}" id="c-ok">${esc(okText)}</button></div></div>`;
    document.body.appendChild(bd);
    bd.querySelector('#c-cancel').onclick = () => { bd.remove(); resolve(false); };
    bd.querySelector('#c-ok').onclick = () => { bd.remove(); resolve(true); };
  });
}
function alertDialog(title, msg) {
  return new Promise(resolve => {
    const bd = document.createElement('div');
    bd.className = 'modal-backdrop show';
    bd.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p class="modal-sub" style="white-space:pre-line;">${esc(msg)}</p><div class="modal-actions"><button class="btn" id="c-ok">확인</button></div></div>`;
    document.body.appendChild(bd);

function promptDialog(title, sub, defaultVal='', placeholder='') {
  return new Promise(resolve => {
    const bd = document.createElement('div');

let CURRENT = null;

async function loadProfile() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return null;
    let { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (!profile) {
      const username = user.email === MENTOR_EMAIL ? MENTOR_USERNAME : user.email.split('@')[0];
      const role = user.email === MENTOR_EMAIL ? 'mentor' : 'mentee';
      const { data: created, error } = await sb.from('profiles').insert({ id: user.id, username, role }).select().single();
      if (error) { console.error('Profile 자동 생성 실패:', error); return null; }
      profile = created;
    }
    return { ...profile, email: user.email };
  } catch (e) { console.error('[loadProfile]', e); return null; }
}

async function signIn(username, password) {
  try {
    const email = username === MENTOR_USERNAME ? MENTOR_EMAIL : studentEmail(username);
    return await sb.auth.signInWithPassword({ email, password });
  } catch (e) { return { error: { message: e.message, _network: isNetworkError(e) } }; }
}
async function signUp(username, password) {
  if (username === MENTOR_USERNAME) return { error: { message: '이 아이디는 사용할 수 없습니다.' } };
  try {
    const email = studentEmail(username);
    return await sb.auth.signUp({ email, password, options: { data: { username } } });
  } catch (e) { return { error: { message: e.message, _network: isNetworkError(e) } }; }
}
async function signOut() {
  await sb.auth.signOut();
  CURRENT = null;
  navigate('login');
}
const isMentor = () => CURRENT && CURRENT.role === 'mentor';

function navigate(route) { location.hash = '#/' + route; }
window.addEventListener('hashchange', render);
window.addEventListener('load', async () => { CURRENT = await loadProfile(); render(); });

async function render() {
  const hash = location.hash.replace(/^#\/?/, '') || (CURRENT ? 'home' : 'login');
  const [base, ...rest] = hash.split('/');
  if (base !== 'login' && !CURRENT) {
    CURRENT = await loadProfile();
    if (!CURRENT) { location.hash = '#/login'; return; }
  }
  if (base === 'login' && CURRENT) { location.hash = '#/home'; return; }
  switch (base) {
    case 'login': return renderLogin();
    case 'home': return renderHome();
    case 'diag': return renderDiag();
    case 'materials': return rest[0] ? renderMaterialDetail(rest[0], 'textbook', '수업 교재') : renderMaterialList('textbook', '수업 교재');
    case 'solve': return rest[0] ? renderPdfSolve(rest[0]) : navigate('materials');
    case 'exams':
      if (rest[0] === 'take' && rest[1]) return renderExamTake(rest[1]);
      if (rest[0] === 'result' && rest[1]) return renderExamResult(rest[1]);
      if (rest[0]) return renderExamDetail(rest[0]);
      return renderExamList();
    case 'quiz':
      if (rest[0] === 'take' && rest[1]) return renderQuizTake(rest[1]);
      if (rest[0] === 'result' && rest[1]) return renderQuizResult(rest[1]);
      if (rest[0]) return renderQuizDetail(rest[0]);
      return renderQuizList();
    case 'videos': return renderVideos();
    case 'schedule': return renderSchedule();
    default: return renderHome();
  }
}

function shell(activeKey, mainHTML) {

    const u = $('#li-u').value.trim(), p = $('#li-p').value;
    const { error } = await signIn(u, p);
    if (error) {
      btn.disabled = false; btn.textContent = '로그인 →';
      if (error._network || isNetworkError(error)) showMsg('li-err', '서버 연결 실패. 잠시 후 다시 시도해주세요.');

function parseAnswerKey(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(x => x && x.label && x.answer != null);
  if (typeof raw === 'object') return Object.keys(raw).sort((a,b) => parseInt(a)-parseInt(b)).map(k => ({ label: k, answer: raw[k] }));
  return [];
}

function renderPdfSection(m, ment) {
  const w = $('#pdf-section');
  w.innerHTML = `<div class="section-head"><h2 class="section-title">문제지 & 답지</h2><span class="section-sub">PDF & Answer Key</span></div><div style="margin-bottom:16px;"><div class="subhead">문제지</div><div id="pdf-file-area"></div>${ment ? `<label class="upload-zone" id="pdf-upload" style="margin-top:10px;"><input type="file" id="pdf-file" accept="application/pdf"><div class="uz-title">PDF 업로드</div><div class="uz-sub">Click or drag · PDF 전용</div><div class="progress-bar" id="pdf-progress"><div class="progress-fill"></div></div></label>` : ''}</div><div><div class="subhead">답지 (라벨 자유 편집)</div><div id="answer-key-area"></div></div>`;
  const area = $('#pdf-file-area');
  if (!m.pdf_path) {
    area.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;border:1px dashed var(--line-2);text-align:center;">아직 PDF가 업로드되지 않았습니다.</div>`;
  } else {
    const { data: pub } = sb.storage.from('materials').getPublicUrl(m.pdf_path);
    const fileName = m.pdf_path.split('/').pop();
    area.innerHTML = `<div class="file-badge"><div class="file-icon">PDF</div><div class="file-meta"><div class="file-name">${esc(fileName)}</div><div class="file-size">업로드됨</div></div>${!ment?`<button class="btn btn-small btn-primary-soft" id="pdf-solve">📝 PDF에 직접 풀기</button>`:''}<a class="btn btn-small btn-ghost" href="${pub.publicUrl}" download target="_blank" rel="noopener">다운로드</a>${ment ? `<button class="btn btn-small btn-danger" id="pdf-remove">삭제</button>` : ''}</div>`;
    if (ment) $('#pdf-remove').onclick = async () => {
      if (!await confirmDialog('PDF를 삭제할까요?', '되돌릴 수 없습니다.', '삭제', true)) return;
      await sb.storage.from('materials').remove([m.pdf_path]);
      await sb.from('materials').update({ pdf_path: null }).eq('id', m.id);
      render();
    };
    if (!ment && $('#pdf-solve')) $('#pdf-solve').onclick = () => {
      location.hash = `#/solve/${m.id}`;
    };
  }
  if (ment) {
    setupFileUpload($('#pdf-upload'), $('#pdf-file'), $('#pdf-progress'), async (file, onProgress) => {
      if (!file.name.toLowerCase().endsWith('.pdf')) throw new Error('PDF 파일만 업로드 가능합니다.');
      const path = `${m.id}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`;
      await uploadFileXHR('materials', path, file, 'application/pdf', onProgress);
      const { error } = await sb.from('materials').update({ pdf_path: path }).eq('id', m.id);
      if (error) throw error;
    });
  }
  const akArea = $('#answer-key-area');
  const ak = parseAnswerKey(m.answer_key);
  if (!ment) {
    akArea.innerHTML = ak.length > 0 ? `<div style="font-size:13px;color:var(--muted);padding:12px;background:var(--paper-3);border-radius:6px;">답안 제출 시 자동 채점 · 총 ${ak.length}문항</div>` : `<div style="font-size:13px;color:var(--muted);padding:12px;background:var(--paper-3);border-radius:6px;">멘토님이 아직 답지를 등록하지 않았습니다.</div>`;
    return;
  }
  akArea.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:10px;">문항 라벨은 자유롭게 적을 수 있어요. 예: <code style="font-family:var(--mono);">1, 2, 3</code> 또는 <code style="font-family:var(--mono);">1-1, 1-2, 2-1</code>.</div><div id="ak-rows"></div><div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"><button class="btn btn-small btn-ghost" id="add-row">＋ 한 줄 추가</button><button class="btn btn-small btn-ghost" id="bulk-add">📝 일괄 입력</button><button class="btn btn-small" id="save-key">답지 저장</button></div>`;
  let rows = ak.length > 0 ? [...ak] : [{label:'1', answer:''}];
  const drawRows = () => {
    const c = $('#ak-rows');
    c.innerHTML = rows.map((r, i) => `<div class="label-row"><input type="text" class="lr-label" data-i="${i}" data-k="label" value="${esc(r.label)}" placeholder="문항 (예: 1-1)" maxlength="20"><input type="text" class="lr-answer" data-i="${i}" data-k="answer" value="${esc(r.answer)}" placeholder="정답" maxlength="20"><button data-del="${i}" type="button" title="삭제">✕</button></div>`).join('');
    c.querySelectorAll('input').forEach(inp => { inp.oninput = () => { rows[parseInt(inp.dataset.i)][inp.dataset.k] = inp.value; }; });
    c.querySelectorAll('button[data-del]').forEach(b => b.onclick = () => {
      rows.splice(parseInt(b.dataset.del), 1);
      if (rows.length === 0) rows = [{label:'', answer:''}];
      drawRows();
    });
  };
  drawRows();
  $('#add-row').onclick = () => {
    const last = rows[rows.length-1]?.label || '';
    let nextLabel = '';
    if (/^\d+$/.test(last)) nextLabel = String(parseInt(last)+1);
    else if (/^(\d+)-(\d+)$/.test(last)) { const mt = last.match(/^(\d+)-(\d+)$/); nextLabel = `${mt[1]}-${parseInt(mt[2])+1}`; }
    rows.push({ label: nextLabel, answer: '' });
    drawRows();
    setTimeout(() => $('#ak-rows').lastElementChild?.querySelector('input.lr-label')?.focus(), 50);
  };
  $('#bulk-add').onclick = () => openBulkAddModal((entries) => { rows = entries.length > 0 ? entries : rows; drawRows(); });
  $('#save-key').onclick = async () => {
    const cleaned = rows.filter(r => r.label && r.label.trim());
    const labels = cleaned.map(r => r.label.trim());
    if (new Set(labels).size !== labels.length) return alertDialog('저장 실패', '중복되는 문항 라벨이 있어요. 라벨은 모두 달라야 합니다.');

    alertDialog('저장 완료', `답지가 저장되었어요. 총 ${final.length}문항.`).then(() => render());
  };
}

function openBulkAddModal(onApply) {
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop show';
  bd.innerHTML = `<div class="modal" style="max-width:520px;"><h3>일괄 입력</h3><p class="modal-sub">한 줄에 하나씩 입력하세요. 라벨과 답을 공백 또는 쉼표로 구분.</p><div style="font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--paper-3);padding:10px;border-radius:6px;margin-bottom:14px;line-height:1.6;">1-1 ②<br>1-2 ④<br>1-3 ①<br>...</div><div class="field"><label>붙여넣기</label><textarea id="bulk-text" rows="10" style="width:100%;font-family:var(--mono);padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;" placeholder="1 ②&#10;2 ④&#10;3-1 ①"></textarea></div><div class="modal-actions"><button class="btn btn-ghost" id="bm-cancel">취소</button><button class="btn" id="bm-ok">적용 (덮어쓰기)</button></div></div>`;
  document.body.appendChild(bd);
  bd.querySelector('#bm-cancel').onclick = () => bd.remove();
  bd.querySelector('#bm-ok').onclick = () => {
    const txt = bd.querySelector('#bulk-text').value;
    const entries = [];
    txt.split('\n').forEach(line => {
      const cleaned = line.trim();
      if (!cleaned) return;
      const parts = cleaned.split(/[\s,]+/);
      if (parts.length >= 2) entries.push({ label: parts[0], answer: parts.slice(1).join(' ') });
      else if (parts.length === 1) entries.push({ label: parts[0], answer: '' });
    });
    bd.remove();
    onApply(entries);
  };
  setTimeout(() => bd.querySelector('#bulk-text').focus(), 100);
}

// === XHR 기반 업로드 헬퍼 (실제 진행률 + 큰 파일도 안정적) ===
async function uploadFileXHR(bucket, path, file, contentType, onProgress) {
  const { data: { session }, error: sErr } = await sb.auth.getSession();
  if (sErr || !session) throw new Error('세션 없음 — 다시 로그인해주세요');
  const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${bucket}/${path}`;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', uploadUrl, true);
    xhr.setRequestHeader('Authorization', `Bearer ${session.access_token}`);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Content-Type', contentType || 'application/octet-stream');
    xhr.setRequestHeader('x-upsert', 'true');
    xhr.setRequestHeader('cache-control', '3600');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else {
        let detail = xhr.responseText;
        try { const j = JSON.parse(xhr.responseText); detail = j.message || j.error || detail; } catch(_) {}
        reject(new Error(`HTTP ${xhr.status}: ${detail}`));
      }
    };
    xhr.onerror = () => reject(new Error('네트워크 연결 끊김. Wi-Fi/셀룰러를 확인하고 다시 시도해주세요.'));
    xhr.onabort = () => reject(new Error('업로드 취소됨'));
    xhr.ontimeout = () => reject(new Error('업로드 시간 초과'));
    xhr.timeout = 60 * 60 * 1000;
    xhr.send(file);
  });
}

function setupFileUpload(zone, input, progressBar, doUpload) {
  const fill = progressBar.querySelector('.progress-fill');
  let uploading = false;
  // 진행률 표시용 span (없으면 만들어줌)
  let statusEl = zone.querySelector('.upload-status');
  if (!statusEl) {
    statusEl = document.createElement('div');
    statusEl.className = 'upload-status';
    statusEl.style.cssText = 'margin-top:8px;font-size:12px;color:var(--ink);font-family:var(--mono);';
    progressBar.parentNode.insertBefore(statusEl, progressBar);
  }
  const setProgress = (loaded, total) => {
    const pct = Math.round((loaded / total) * 95);
    fill.style.width = pct + '%';
    statusEl.innerHTML = `⏳ <strong>${pct}%</strong> · ${fmtBytes(loaded)} / ${fmtBytes(total)}`;
  };
  const handle = async (file) => {
    if (!file || uploading) return;
    uploading = true;
    progressBar.classList.add('show'); fill.style.width = '0%';
    statusEl.innerHTML = `⏳ <strong>준비 중...</strong> (${fmtBytes(file.size)})`;
    try {
      await doUpload(file, setProgress);
      fill.style.width = '100%';
      statusEl.innerHTML = `✓ <strong>완료!</strong>`;
      setTimeout(() => render(), 500);
    } catch (e) {
      progressBar.classList.remove('show'); fill.style.width = '0%';
      uploading = false;
      console.error('[Upload]', e);
      let msg = e.message || String(e);
      const ml = msg.toLowerCase();
      if (ml.includes('row-level') || ml.includes('rls') || ml.includes('policy') || ml.includes('unauthorized') || ml.includes('403')) {
        msg = '권한 오류 — setup.sql v4 실행 + 멘토 재로그인 했는지 확인해주세요.\n\n원본: ' + msg;
      } else if (ml.includes('exceeded') || ml.includes('payload too large') || ml.includes('size') || ml.includes('413')) {
        msg = '파일이 너무 큽니다 (2GB 초과). setup.sql v4 실행을 확인해주세요.\n\n원본: ' + msg;
      }
      statusEl.innerHTML = `❌ <strong style="color:var(--red);">실패</strong>`;
      alertDialog('업로드 실패', msg);
    }
  };
  zone.onclick = e => { if (e.target !== input) input.click(); };
  input.onchange = e => handle(e.target.files[0]);
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragging'); };
  zone.ondragleave = () => zone.classList.remove('dragging');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragging'); handle(e.dataTransfer.files[0]); };
}

async function renderMentorAnswerPanel(w, m) {
  const ak = parseAnswerKey(m.answer_key);

  if (ak.length === 0) return;
  const selected = new Set(allowedLabels);
  const chips = $('#label-chips');
  const draw = () => {
    chips.innerHTML = ak.map(r => `<div class="label-chip ${selected.has(r.label)?'selected':''}" data-l="${esc(r.label)}">${esc(r.label)}</div>`).join('');
    chips.querySelectorAll('.label-chip').forEach(c => c.onclick = () => {
      const l = c.dataset.l;
      selected.has(l) ? selected.delete(l) : selected.add(l);
      c.classList.toggle('selected');
    });
  };
  draw();
  $('#sel-all').onclick = () => { ak.forEach(r => selected.add(r.label)); draw(); };
  $('#sel-none').onclick = () => { selected.clear(); draw(); };
  $('#save-allowed').onclick = async () => {
    const arr = ak.map(r => r.label).filter(l => selected.has(l));
    const { error } = await sb.from('materials').update({ allowed_labels: arr }).eq('id', m.id);
    if (error) return alertDialog('저장 실패', error.message);
    alertDialog('저장 완료', `${arr.length}개 문항이 숙제로 지정되었습니다.`);
  };
}

function renderMenteeAnswerPanel(w, m, submission) {
  const ak = parseAnswerKey(m.answer_key);
  const allowed = new Set(m.allowed_labels || []);
  if (ak.length === 0) return w.innerHTML = `<div class="section-head"><h2 class="section-title">답안 제출</h2></div><div style="padding:14px;background:var(--paper-3);border-radius:6px;font-size:13px;color:var(--muted);">멘토님이 아직 답지를 등록하지 않았습니다.</div>`;
  if (allowed.size === 0) return w.innerHTML = `<div class="section-head"><h2 class="section-title">답안 제출</h2></div><div style="padding:14px;background:var(--paper-3);border-radius:6px;font-size:13px;color:var(--muted);">이 교재는 아직 숙제로 지정되지 않았어요.</div>`;
  const graded = submission?.score != null;
  w.innerHTML = `<div class="section-head"><h2 class="section-title">${graded?'채점 결과':'답안 제출'}</h2><span class="section-sub">${submission?'제출 완료':'미제출'}</span></div><div style="font-size:13px;color:var(--muted);margin-bottom:10px;">숙제 범위 · 총 ${allowed.size}문항 ${submission?'(다시 제출 가능)':''}</div><div class="answers-flex" id="m-grid"></div>${graded ? `<div class="score-display"><div><div class="score-label">맞은 개수</div><div class="score-big"><span>${submission.score}</span> / ${submission.total}</div></div><div style="font-family:'Fraunces',serif;font-size:32px;color:var(--gold);">${submission.total?Math.round(submission.score/submission.total*100):0}%</div></div>` : ''}<button class="btn" id="submit-ans" style="margin-top:18px;">${submission?'다시 제출하고 재채점':'제출하고 채점하기'}</button>`;
  const grid = $('#m-grid');
  const prior = submission?.answers || {};
  grid.innerHTML = ak.map(r => {
    const isAllow = allowed.has(r.label);
    const v = prior[r.label] ?? '';
    let cls = '', badge = '';
    if (graded && isAllow && v) {
      if (normalizeAns(v) === normalizeAns(r.answer)) { cls='correct'; badge=`<div class="correct-mark">✓</div>`; }
      else { cls='wrong'; badge=`<div class="correct-mark">정답: ${esc(r.answer)}</div>`; }
    }
    return `<div class="answer-box ${isAllow?'':'locked'} ${cls}"><div class="slot-num">${esc(r.label)}</div><input type="text" class="m-input" data-l="${esc(r.label)}" value="${esc(v)}" ${isAllow?'':'disabled'} maxlength="20" placeholder="${isAllow?'':'-'}">${badge}</div>`;
  }).join('');
  $('#submit-ans').onclick = async () => {
    const answers = {};
    document.querySelectorAll('.m-input').forEach(i => {
      const l = i.dataset.l;
      if (allowed.has(l)) { const v = i.value.trim(); if (v) answers[l] = v; }
    });
    if (Object.keys(answers).length === 0) return alertDialog('입력 필요', '최소 한 문제 이상 답안을 입력해주세요.');
    const ok = await confirmDialog('답안을 제출할까요?', `총 ${Object.keys(answers).length}개 문항이 채점됩니다.`, '제출');
    if (!ok) return;
    let score = 0;
    ak.forEach(r => { if (allowed.has(r.label) && answers[r.label] && normalizeAns(answers[r.label]) === normalizeAns(r.answer)) score++; });
    const { error } = await sb.from('submissions').upsert({ material_id: m.id, user_id: CURRENT.id, answers, score, total: allowed.size }, { onConflict: 'material_id,user_id' });
    if (error) return alertDialog('제출 실패', error.message);
    render();
  };
}

async function renderAnalysisSection(m) {
  const w = $('#analysis-section');
  const ak = parseAnswerKey(m.answer_key);
  const allowed = m.allowed_labels || [];
  if (ak.length === 0 || allowed.length === 0) { w.innerHTML = ''; return; }
  w.innerHTML = `<div class="section"><div class="section-head"><h2 class="section-title">성적 분석</h2><span class="section-sub">Mentor Analytics</span></div><div class="tabs"><button class="tab active" data-tab="mentee">개별 멘티 분석</button><button class="tab" data-tab="question">문항별 분석</button></div><div id="analysis-body"><div class="loading">분석 중...</div></div></div>`;
  const { data: subs } = await sb.from('submissions').select('*, profiles(username)').eq('material_id', m.id).order('submitted_at', { ascending: false });
  const akMap = {};
  ak.forEach(r => { akMap[r.label] = r.answer; });
  const drawMentee = () => {
    const body = $('#analysis-body');
    if (!subs || subs.length === 0) { body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 제출한 멘티가 없어요.</div>`; return; }
    body.innerHTML = subs.map(s => {
      const wrongs = [];
      allowed.forEach(label => {
        const studentAns = s.answers[label];
        const correct = akMap[label];
        if (!studentAns || normalizeAns(studentAns) !== normalizeAns(correct)) wrongs.push({ label, studentAns: studentAns || '미제출', correct });
      });
      const pct = s.total ? Math.round(s.score/s.total*100) : 0;
      return `<div class="mentee-row" data-id="${s.id}"><div class="mentee-row-head"><div><div class="mentee-row-name">${esc(s.profiles?.username || '?')}</div><div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;">${fmtDateTime(s.submitted_at)} · 틀린 문항 ${wrongs.length}개</div></div><div class="mentee-row-score"><span>${s.score}</span><span style="color:var(--muted);font-size:14px;"> / ${s.total}</span> · ${pct}%</div></div><div class="mentee-row-detail">${wrongs.length === 0 ? `<div style="color:var(--green);font-family:var(--mono);font-size:12px;">🎉 만점!</div>` : `<div style="font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;">틀린 문항 (라벨 · 멘티답 → 정답)</div><div class="wrong-list">${wrongs.map(w => `<div class="wrong-item">${esc(w.label)} : ${esc(w.studentAns)} → ${esc(w.correct)}</div>`).join('')}</div>`}</div></div>`;
    }).join('');
    body.querySelectorAll('.mentee-row').forEach(row => row.onclick = () => row.classList.toggle('expanded'));
  };
  const drawQuestion = () => {
    const body = $('#analysis-body');
    if (!subs || subs.length === 0) { body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 제출한 멘티가 없어요.</div>`; return; }
    const stats = allowed.map(label => {
      const correct = akMap[label];
      const wrongMentees = [];
      let attemptCount = 0;
      subs.forEach(s => {
        attemptCount++;
        const ans = s.answers[label];
        if (!ans || normalizeAns(ans) !== normalizeAns(correct)) wrongMentees.push(s.profiles?.username || '?');
      });
      const wrongRate = attemptCount > 0 ? wrongMentees.length / attemptCount : 0;
      return { label, correct, wrongMentees, total: attemptCount, wrongRate };
    });
    stats.sort((a, b) => b.wrongRate - a.wrongRate);
    body.innerHTML = `<div style="font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;">오답률 높은 순 정렬 · 총 제출자 ${subs.length}명</div>${stats.map(s => {
      const pct = Math.round(s.wrongRate * 100);
      return `<div class="q-stat-row"><div class="q-stat-label">${esc(s.label)}<div style="font-size:10px;color:var(--muted);font-weight:400;">정답: ${esc(s.correct)}</div></div><div class="q-stat-bar"><div class="q-stat-fill ${pct>=50?'danger':''}" style="width:${pct}%"></div></div><div class="q-stat-rate">${s.wrongMentees.length}/${s.total} <span style="color:${pct>=50?'var(--red)':'var(--muted)'};">(${pct}%)</span></div>${s.wrongMentees.length > 0 ? `<div class="q-stat-mentees">틀린 멘티: ${s.wrongMentees.map(u => `<span>${esc(u)}</span>`).join('')}</div>` : ''}</div>`;
    }).join('')}`;
  };
  drawMentee();
  w.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    w.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    if (t.dataset.tab === 'mentee') drawMentee();
    else drawQuestion();
  });
}

  shell('quiz', `<a class="detail-back" href="#/quiz">← 비킬러 목록</a><div class="page-head fade-up fade-up-1"><div><div class="page-eyebrow">비킬러 세트 · ${Math.floor(s.time_limit_seconds/60)}분 · ${(questions||[]).length}문항</div><h1 class="page-title">${esc(s.title)}</h1>${s.description ? `<div style="color:var(--muted);margin-top:6px;font-size:14px;">${esc(s.description)}</div>` : ''}</div>${ment ? `<div style="display:flex;gap:8px;"><button class="btn btn-small btn-ghost" id="rename-q">설정 변경</button><button class="btn btn-small btn-danger" id="delete-q">삭제</button></div>` : `<button class="btn btn-small btn-primary-soft" id="start-quiz" ${(!questions||questions.length===0)?'disabled':''}>${myAttempts.length>0?'다시 응시':'응시 시작'} →</button>`}</div>${ment ? `<div class="section fade-up fade-up-2" style="margin-bottom:24px;"><div class="section-head"><h2 class="section-title">문제 추가</h2><span class="section-sub">Mentor</span></div><div style="font-size:13px;color:var(--muted);margin-bottom:10px;">문제 이미지를 업로드하고 정답을 입력하세요. (정답 예: <code style="font-family:var(--mono);">ㄱ</code>, <code style="font-family:var(--mono);">ㄱㄴ</code>, <code style="font-family:var(--mono);">ㄴㄷㄹ</code>)</div><label class="upload-zone" id="qi-zone" style="margin-bottom:10px;"><input type="file" id="qi-file" accept="image/*"><div class="uz-title">문제 이미지 선택</div><div class="uz-sub">jpg · png · webp</div><div id="qi-preview" style="margin-top:10px;font-size:13px;color:var(--ink);"></div><div class="progress-bar" id="qi-progress"><div class="progress-fill"></div></div></label><div class="field"><label>정답</label><input type="text" id="qi-ans" placeholder="ㄱ, ㄱㄴ, ㄴㄷㄹ ..." maxlength="10"></div><button class="btn" id="qi-save">＋ 문제 추가</button></div><div class="section fade-up fade-up-3" style="margin-bottom:24px;"><div class="section-head"><h2 class="section-title">등록된 문제 (${(questions||[]).length})</h2></div><div id="q-list"></div></div><div id="quiz-analysis" class="fade-up fade-up-4"></div>` : `<div class="section fade-up fade-up-3"><div class="section-head"><h2 class="section-title">내 응시 기록 (${myAttempts.length}회차)</h2></div><div id="my-attempts"></div></div>`}`);
  if (ment) {
    $('#rename-q').onclick = async () => {
      const t = await promptDialog('제목 변경', '새 제목을 입력하세요.', s.title);
      if (!t) return;
      const minStr = await promptDialog('시간 제한', '분 단위로 입력하세요.', String(Math.floor(s.time_limit_seconds/60)));
      if (!minStr) return;
      const min = parseInt(minStr);
      if (!min || min < 1) return;
      await sb.from('quiz_sessions').update({ title: t, time_limit_seconds: min*60 }).eq('id', id);
      render();
    };
    $('#delete-q').onclick = async () => {
      if (!await confirmDialog('정말 삭제하시겠어요?', '모든 문제와 응시 기록이 함께 삭제됩니다.', '삭제', true)) return;
      if (questions && questions.length > 0) await sb.storage.from('quiz-images').remove(questions.map(q => q.image_path));
      await sb.from('quiz_sessions').delete().eq('id', id);
      navigate('quiz');
    };
    setupQuizQuestionUpload(id);
    drawMentorQuestionList(questions || []);
    renderQuizAnalysis(id, questions || []);
  } else {
    $('#start-quiz').onclick = () => location.hash = `#/quiz/take/${id}`;
    drawMyAttempts(myAttempts, questions || []);
  }
}

function setupQuizQuestionUpload(sessionId) {
  const zone = $('#qi-zone'), input = $('#qi-file'), prog = $('#qi-progress'), preview = $('#qi-preview');
  let chosen = null;
  zone.onclick = e => { if (e.target !== input) input.click(); };
  input.onchange = e => { chosen = e.target.files[0]; if (chosen) preview.innerHTML = `선택됨: <strong>${esc(chosen.name)}</strong> (${fmtBytes(chosen.size)})`; };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('dragging'); };
  zone.ondragleave = () => zone.classList.remove('dragging');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('dragging'); chosen = e.dataTransfer.files[0]; if (chosen) preview.innerHTML = `선택됨: <strong>${esc(chosen.name)}</strong> (${fmtBytes(chosen.size)})`; };
  $('#qi-save').onclick = async () => {
    if (!chosen) return alertDialog('파일 선택', '이미지를 먼저 선택해주세요.');
    const ans = $('#qi-ans').value.trim();
    if (!ans) return alertDialog('정답 입력', '정답을 입력해주세요.');
    const btn = $('#qi-save'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 업로드 중...';
    prog.classList.add('show');
    const fill = prog.querySelector('.progress-fill');
    fill.style.width = '0%';
    try {
      const ext = (chosen.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${sessionId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      await uploadFileXHR('quiz-images', path, chosen, chosen.type || 'image/jpeg', (loaded, total) => {
        const pct = Math.round((loaded / total) * 95);
        fill.style.width = pct + '%';
      });
      const { data: existing } = await sb.from('quiz_questions').select('q_order').eq('session_id', sessionId).order('q_order', { ascending: false }).limit(1);
      const nextOrder = (existing?.[0]?.q_order ?? -1) + 1;
      const { error: insErr } = await sb.from('quiz_questions').insert({ session_id: sessionId, image_path: path, correct_answer: ans, q_order: nextOrder });
      if (insErr) throw insErr;
      fill.style.width = '100%';
      setTimeout(render, 300);
    } catch (e) {
      prog.classList.remove('show'); fill.style.width = '0%';
      btn.disabled = false; btn.innerHTML = '＋ 문제 추가';
      console.error(e);
      let msg = e.message || String(e);
      const ml = msg.toLowerCase();
      if (ml.includes('row-level') || ml.includes('rls') || ml.includes('policy') || ml.includes('unauthorized') || ml.includes('403')) {
        msg = '권한 오류 — setup.sql v4 실행 + 멘토 재로그인 확인해주세요.\n\n원본: ' + msg;
      } else if (ml.includes('exceeded') || ml.includes('size') || ml.includes('413')) {
        msg = '파일이 너무 큽니다. setup.sql v4 실행을 확인해주세요.\n\n원본: ' + msg;
      }
      alertDialog('업로드 실패', msg);
    }
  };
}

function drawMentorQuestionList(questions) {
  const c = $('#q-list');
  if (!questions || questions.length === 0) { c.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 등록된 문제가 없어요.</div>`; return; }
  c.innerHTML = questions.map((q, i) => {
    const { data: pub } = sb.storage.from('quiz-images').getPublicUrl(q.image_path);
    return `<div class="quiz-question-card"><img src="${pub.publicUrl}" alt="문제 ${i+1}"><div class="qq-info"><div class="quiz-q-num">문제 ${i+1}</div><div class="quiz-q-answer">정답: <span style="color:var(--burgundy);font-weight:600;">${esc(q.correct_answer)}</span></div></div><button class="btn btn-small btn-danger" data-del="${q.id}" data-path="${esc(q.image_path)}" style="width:auto;">삭제</button></div>`;
  }).join('');
  c.querySelectorAll('button[data-del]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('이 문제를 삭제할까요?', '되돌릴 수 없습니다.', '삭제', true)) return;
    await sb.storage.from('quiz-images').remove([b.dataset.path]);
    await sb.from('quiz_questions').delete().eq('id', b.dataset.del);
    render();
  });
}

function drawMyAttempts(attempts, questions) {
  const c = $('#my-attempts');
  if (!attempts || attempts.length === 0) { c.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 응시 기록이 없어요. 위에서 시작해보세요.</div>`; return; }
  c.innerHTML = attempts.map((a, i) => {
    const pct = a.total ? Math.round(a.score/a.total*100) : 0;
    return `<a href="#/quiz/result/${a.id}" class="mentee-row" style="display:block;text-decoration:none;"><div class="mentee-row-head"><div><div class="mentee-row-name">${attempts.length - i}회차</div><div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;">${fmtDateTime(a.submitted_at)} · ${fmtTime(a.time_taken_seconds||0)} 소요</div></div><div class="mentee-row-score"><span>${a.score}</span><span style="color:var(--muted);font-size:14px;"> / ${a.total}</span> · ${pct}%</div></div></a>`;
  }).join('');
}

async function renderQuizAnalysis(sessionId, questions) {
  const w = $('#quiz-analysis');
  if (!questions || questions.length === 0) { w.innerHTML = ''; return; }
  w.innerHTML = `<div class="section"><div class="section-head"><h2 class="section-title">응시 분석</h2><span class="section-sub">Mentor Analytics</span></div><div class="tabs"><button class="tab active" data-tab="mentee">개별 멘티 분석</button><button class="tab" data-tab="question">문항별 분석</button></div><div id="qa-body"><div class="loading">분석 중...</div></div></div>`;
  const { data: attempts } = await sb.from('quiz_attempts').select('*, profiles(username)').eq('session_id', sessionId).not('submitted_at', 'is', null).order('submitted_at', { ascending: false });
  const qMap = {};
  questions.forEach((q, i) => { qMap[q.id] = { ...q, index: i+1 }; });
  const drawMentee = () => {
    const body = $('#qa-body');
    if (!attempts || attempts.length === 0) { body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 응시 기록이 없어요.</div>`; return; }
    const byUser = {};
    attempts.forEach(a => { const u = a.profiles?.username || '?'; if (!byUser[u]) byUser[u] = []; byUser[u].push(a); });
    body.innerHTML = Object.keys(byUser).map(u => {
      const userAttempts = byUser[u];
      return userAttempts.map((a, idx) => {
        const wrongs = [];
        questions.forEach(q => {
          const studentAns = a.responses?.[q.id];
          if (!studentAns || normalizeAns(studentAns) !== normalizeAns(q.correct_answer)) wrongs.push({ index: qMap[q.id].index, studentAns: studentAns || '미제출', correct: q.correct_answer });
        });
        const pct = a.total ? Math.round(a.score/a.total*100) : 0;
        return `<div class="mentee-row" data-id="${a.id}"><div class="mentee-row-head"><div><div class="mentee-row-name">${esc(u)} <span style="color:var(--muted);font-size:13px;font-family:var(--mono);">— ${userAttempts.length - idx}회차</span></div><div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;">${fmtDateTime(a.submitted_at)} · ${fmtTime(a.time_taken_seconds||0)}</div></div><div class="mentee-row-score"><span>${a.score}</span><span style="color:var(--muted);font-size:14px;"> / ${a.total}</span> · ${pct}%</div></div><div class="mentee-row-detail">${wrongs.length === 0 ? `<div style="color:var(--green);font-family:var(--mono);font-size:12px;">🎉 만점!</div>` : `<div style="font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;">틀린 문항 (문항 · 멘티답 → 정답)</div><div class="wrong-list">${wrongs.map(w => `<div class="wrong-item">${w.index}번 : ${esc(w.studentAns)} → ${esc(w.correct)}</div>`).join('')}</div>`}</div></div>`;
      }).join('');
    }).join('');
    body.querySelectorAll('.mentee-row').forEach(row => row.onclick = () => row.classList.toggle('expanded'));
  };
  const drawQuestion = () => {
    const body = $('#qa-body');
    if (!attempts || attempts.length === 0) { body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:14px;background:var(--paper-3);border-radius:6px;">아직 응시 기록이 없어요.</div>`; return; }
    const stats = questions.map((q, i) => {
      const wrongMentees = [];
      let attemptCount = 0;
      attempts.forEach(a => {
        attemptCount++;
        const ans = a.responses?.[q.id];
        if (!ans || normalizeAns(ans) !== normalizeAns(q.correct_answer)) wrongMentees.push(a.profiles?.username || '?');
      });
      const wrongRate = attemptCount > 0 ? wrongMentees.length / attemptCount : 0;
      return { index: i+1, correct: q.correct_answer, wrongMentees, total: attemptCount, wrongRate };
    });
    stats.sort((a, b) => b.wrongRate - a.wrongRate);
    body.innerHTML = `<div style="font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;">오답률 높은 순 정렬 · 총 응시 ${attempts.length}회</div>${stats.map(s => {
      const pct = Math.round(s.wrongRate * 100);
      return `<div class="q-stat-row"><div class="q-stat-label">${s.index}번<div style="font-size:10px;color:var(--muted);font-weight:400;">정답: ${esc(s.correct)}</div></div><div class="q-stat-bar"><div class="q-stat-fill ${pct>=50?'danger':''}" style="width:${pct}%"></div></div><div class="q-stat-rate">${s.wrongMentees.length}/${s.total} <span style="color:${pct>=50?'var(--red)':'var(--muted)'};">(${pct}%)</span></div>${s.wrongMentees.length > 0 ? `<div class="q-stat-mentees">틀린 멘티: ${s.wrongMentees.map(u => `<span>${esc(u)}</span>`).join('')}</div>` : ''}</div>`;
    }).join('')}`;
  };
  drawMentee();
  w.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    w.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    if (t.dataset.tab === 'mentee') drawMentee();
    else drawQuestion();
  });
}

let QUIZ_STATE = null;

async function renderQuizTake(sessionId) {
  if (isMentor()) { await alertDialog('알림', '멘토는 응시할 수 없습니다.'); navigate('quiz'); return; }
  app().innerHTML = `<div class="loading">불러오는 중...</div>`;
  const { data: session } = await sb.from('quiz_sessions').select('*').eq('id', sessionId).maybeSingle();
  if (!session) { navigate('quiz'); return; }
  const { data: questions } = await sb.from('quiz_questions').select('*').eq('session_id', sessionId).order('q_order').order('created_at');
  if (!questions || questions.length === 0) { await alertDialog('문제 없음', '아직 문제가 등록되지 않았어요.'); navigate(`quiz/${sessionId}`); return; }
  const { data: attempt, error: aErr } = await sb.from('quiz_attempts').insert({ session_id: sessionId, user_id: CURRENT.id, responses: {}, total: questions.length, started_at: new Date().toISOString() }).select().single();
  if (aErr) { await alertDialog('시작 실패', aErr.message); navigate(`quiz/${sessionId}`); return; }
  QUIZ_STATE = {
    mode: 'quiz', session, questions, attempt, responses: {},
    currentIdx: 0, startedAt: Date.now(), timeLimit: session.time_limit_seconds,
    timer: null, submitted: false,
    contentType: 'image',
    images: questions.map(q => ({ url: sb.storage.from('quiz-images').getPublicUrl(q.image_path).data.publicUrl })),
    questionLabels: questions.map((_, i) => `${i+1}번`),
    answerHint: '예: ㄱ, ㄱㄴ, ㄴㄷㄹ',
    answerPlaceholder: 'ㄱㄴㄷ ...'
  };
  buildTakeUI();
}

    $('#qt-prev').onclick = () => { saveCurrentMemo(); showQuestion(QUIZ_STATE.currentIdx - 1); };
    $('#qt-next').onclick = () => { saveCurrentMemo(); showQuestion(QUIZ_STATE.currentIdx + 1); };
  }
  $('#qt-submit').onclick = () => confirmSubmit();

      if (v) QUIZ_STATE.responses[q.id] = v;
      else delete QUIZ_STATE.responses[q.id];
    }
    updateProgressDots();
    updateSubmitButton();
  };
